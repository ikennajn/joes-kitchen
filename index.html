                <div className="step-allocation-form"><div className="recipe-field wide"><label>Ingredient from shortlist</label><select value={allocationForm.recipe_ingredient_id} onChange={e=>chooseAllocationIngredient(e.target.value)}><option value="">Select ingredient</option>{versionIngredients.filter(ingredient=>!focusedAllocations.some(allocation=>allocation.recipe_ingredient_id===ingredient.id)).map(ingredient=><option key={ingredient.id} value={ingredient.id}>{ingredient.ingredient_name}</option>)}</select></div><div className="recipe-field"><label>Amount used</label><input type="number" min="0.01" step="0.01" inputMode="decimal" value={allocationForm.quantity} onChange={e=>setAllocationForm({...allocationForm,quantity:e.target.value})} /></div><div className="recipe-field"><label>Unit</label><input value={allocationForm.unit} onChange={e=>setAllocationForm({...allocationForm,unit:e.target.value})} /></div><button className="recipe-action primary" onClick={addProcessIngredient} disabled={!allocationForm.recipe_ingredient_id||Number(allocationForm.quantity)<=0}>Add to process</button></div>
              </div></div></div>}
              <div className="recipe-inline"><div className="recipe-field wide"><label>New process name</label><input value={processName} onChange={e=>setProcessName(e.target.value)} placeholder="e.g. Simmer tomato sauce" /></div><div className="recipe-field wide"><label>Process description</label><textarea value={newProcessDescription} onChange={e=>setNewProcessDescription(e.target.value)} placeholder="What happens in this process?" /></div><button className="recipe-action primary" onClick={addProcess} disabled={!processName.trim()}>Add process</button></div>
            </section></>}

            {recipeStage===3&&<><div className="recipe-stage-intro"><strong>Review the assembled recipe</strong><span>Every connected process now carries its own description, ingredient list, and confirmed time.</span></div><section className="recipe-section"><div className="recipe-section-title">Recipe timeline</div><div className="recipe-ready-summary"><div><strong>{versionIngredients.length}</strong><span>Shortlist</span></div><div><strong>{versionProcesses.length}</strong><span>Processes</span></div><div><strong>{versionProcesses.filter(process=>data.steps.find(step=>step.process_id===process.id)?.expected_duration_seconds).length}</strong><span>Timed</span></div></div><div className="process-timeline">{versionProcesses.map((process,index)=>{const processSteps=data.steps.filter(step=>step.process_id===process.id),processAllocations=data.allocations.filter(allocation=>processSteps.some(step=>step.id===allocation.recipe_step_id)),saved=processSteps[0]?.expected_duration_seconds;return <div className="process-node" key={process.id}><button className="process-node-main" onClick={()=>{setActiveProcessId(process.id);setRecipeStage(2);}}><strong>{index+1}. {process.name}</strong><span>{process.notes||'No description yet'} · {processAllocations.length} ingredient{processAllocations.length===1?'':'s'}{saved?` · ${flowClock(saved)}`:' · time not saved'}</span></button></div>})}</div><div className="recipe-section-sub">Finishing saves this cooking session without changing inventory.</div></section></>}
          </>}
          <div className="recipe-stage-actions">
            {recipeStage>0&&<button className="recipe-action" onClick={()=>setRecipeStage(recipeStage-1)}>Back</button>}
            {recipeStage===0&&<button className="recipe-action primary" onClick={()=>saveCore(true)} disabled={saving||!form.name.trim()}>{saving?'Saving…':activeId==='new'?'Create & add ingredients':'Save & continue'}</button>}
            {recipeStage===1&&<button className="recipe-action primary" onClick={()=>setRecipeStage(2)} disabled={versionIngredients.length===0}>{versionIngredients.length?'Continue to cooking flow':'Add an ingredient to continue'}</button>}
            {recipeStage===2&&<button className="recipe-action primary" onClick={()=>setRecipeStage(3)} disabled={versionProcesses.length===0}>{versionProcesses.length?'Review recipe':'Add a process to continue'}</button>}
            {recipeStage===3&&<button className="recipe-action primary" onClick={finishRecipeBuild}>Finish recipe</button>}
          </div>
          {activeId!=='new'&&recipeStage===0&&(activeRecipe?.status==='draft'?<button className="recipe-action" style={{color:'var(--er)',borderColor:'color-mix(in srgb,var(--er) 35%,var(--bd))'}} onClick={removeRecipe}>Delete draft recipe</button>:<button className="recipe-action" onClick={archiveRecipe}>Archive recipe</button>)}
        </div>
      </div>
    );
  }

  return <div className="page"><div className="page-hdr" style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:12}}><div><div className="page-title">Recipe library</div><div className="page-sub">Capture repeatable kitchen processes in detail.</div></div><button className="btn-pr" style={{minHeight:44}} onClick={()=>{setRecipeStage(0);setActiveId('new');}}>New recipe</button></div>
    <div className="recipe-library-summary"><div><strong>{data.recipes.length}</strong><span>Recipes</span></div><div><strong>{data.versions.filter(v=>v.status==='draft').length}</strong><span>Drafts</span></div><div><strong>{data.ingredients.length}</strong><span>Ingredients</span></div></div>
    <div className="recipe-library-head"><strong>Your recipes</strong><span>Newest first</span></div>
    {loading ? <div style={{padding:40,textAlign:'center',color:'var(--tx2)'}}>Loading recipes…</div> : data.recipes.length === 0 ? <div className="recipe-empty">No recipes yet. Create your first draft while you cook.</div> : <div className="recipe-grid">{data.recipes.map(recipe=>{const version=data.versions.find(v=>v.id===recipe.current_version_id);const ingredients=data.ingredients.filter(i=>i.recipe_version_id===version?.id);const processes=data.processes.filter(p=>p.recipe_version_id===version?.id);return <div key={recipe.id} className="recipe-card" role="button" tabIndex="0" onClick={()=>{setRecipeStage(0);setActiveId(recipe.id);}} onKeyDown={e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setRecipeStage(0);setActiveId(recipe.id);}}}><span className="recipe-card-icon"><NavIcon name="meal" /></span><div className="recipe-card-body"><div className="recipe-card-top"><div className="recipe-name">{recipe.name}</div><span className="recipe-status">{version?.status || recipe.status}</span></div>{recipe.description&&<div className="recipe-description">{recipe.description}</div>}<div className="recipe-meta"><span className="recipe-chip">{version?.yield_quantity || '—'} {version?.yield_unit || 'yield'}</span><span className="recipe-chip">{ingredients.length} ingredient{ingredients.length===1?'':'s'}</span><span className="recipe-chip">{processes.length} process{processes.length===1?'':'es'}</span>{ingredients.length>0&&<span className="recipe-chip">~${estimateCost(ingredients).toFixed(2)} batch</span>}</div></div><span className="recipe-card-chevron">›</span></div>;})}</div>}
    <button className="recipe-fab" onClick={()=>{setRecipeStage(0);setActiveId('new');}}>New recipe</button>
  </div>;
}

/* ─── SESSION PURCHASE EDITOR ─── */
// Editable list of every item purchased during a session.
// Lets owner correct prices/quantities, delete erroneous entries,
// add items that were missed off the receipt, and add inventory items
// that should have been ticked but weren't.
function SessionPurchaseEditor({ session, inventoryItems, onTotalChange, onInventoryUpdate, refreshTick }) {
  const [purchases, setPurchases] = useState([]);
  const [loading, setLoading] = useState(true);
  const [editingId, setEditingId] = useState(null);
  const [draft, setDraft] = useState({}); // { name, store, qty, price }
  const [showAddInventory, setShowAddInventory] = useState(false);
  const [showAddShopping, setShowAddShopping] = useState(false);
  const [showAddCustom, setShowAddCustom] = useState(false);
  const [invFilter, setInvFilter] = useState('');
  const [shopFilter, setShopFilter] = useState('');
  const [customDraft, setCustomDraft] = useState({ name: '', store: '', qty: 1, price: 0, category: 'Other', unit: 'ct' });

  useEffect(() => {
    db.getSessionPurchases(session.id).then(rows => {
      setPurchases(rows || []);
      setLoading(false);
      onTotalChange?.((rows || []).reduce((s, r) => s + Number(r.price || 0) * Number(r.qty || 1), 0));
    }).catch(() => setLoading(false));
  }, [session.id, refreshTick]);

  const recalcTotal = (list) => onTotalChange?.(list.reduce((s, r) => s + Number(r.price || 0) * Number(r.qty || 1), 0));

  const startEdit = (p) => {
    setEditingId(p.id);
    setDraft({ name: p.item_name, store: p.store || '', qty: p.qty, price: p.price });
  };

  const saveEdit = async (p) => {
    const fields = {
      item_name: draft.name.trim(),
      store: draft.store,
      qty: Number(draft.qty) || 1,
      price: Number(draft.price) || 0,
    };
    try { await db.updatePurchase(p.id, fields); } catch (e) { alert('Save failed: ' + e.message); return; }
    const updated = purchases.map(r => r.id === p.id ? { ...r, ...fields } : r);
    setPurchases(updated);
    recalcTotal(updated);
    setEditingId(null);
  };

  const removeRow = async (p) => {
    if (!confirm(`Remove "${p.item_name}" from this trip?`)) return;
    try { await db.deletePurchase(p.id); } catch (e) { alert('Delete failed: ' + e.message); return; }
    const updated = purchases.filter(r => r.id !== p.id);
    setPurchases(updated);
    recalcTotal(updated);
  };

  const addFromInventory = async (item) => {
    const newRow = {
      session_id: session.id,
      item_id: item.id,
      item_name: item.name,
      category: item.category,
      store: item.store,
      unit: item.unit,
      qty: Math.max(1, item.par_level - item.current_qty) || 1,
      price: Number(item.price || 0),
      purchased_at: session.started_at || new Date().toISOString(),
    };
    try {
      const inserted = await db.insertPurchase(newRow);
      const row = inserted?.[0] || newRow;
      const updated = [...purchases, row];
      setPurchases(updated);
      recalcTotal(updated);
      setShowAddInventory(false);
      setInvFilter('');
    } catch (e) { alert('Add failed: ' + e.message); }
  };

  // Add an item that's currently on the shopping list (out/low) to this session.
  // Bumps inventory qty up to par level (so it leaves the shopping list) and
  // logs the purchase. Useful when a receipt didn't itemize and you missed
  // ticking it during the trip.
  const addFromShoppingList = async (item) => {
    const fillQty = Math.max(1, item.par_level - item.current_qty);
    const newRow = {
      session_id: session.id,
      item_id: item.id,
      item_name: item.name,
      category: item.category,
      store: item.store,
      unit: item.unit,
      qty: fillQty,
      price: Number(item.price || 0),
      purchased_at: session.started_at || new Date().toISOString(),
    };
    try {
      // 1. Log the purchase
      const inserted = await db.insertPurchase(newRow);
      const row = inserted?.[0] || newRow;
      const updated = [...purchases, row];
      setPurchases(updated);
      recalcTotal(updated);

      // 2. Bump inventory qty to par (removes it from the shopping list)
      const newInvFields = {
        current_qty: item.par_level,
        checked_at: null,
        session_id: null,
      };
      try {
        await db.update(item.id, newInvFields);
        onInventoryUpdate?.(item.id, newInvFields);
      } catch (e) { console.error('Inventory update failed', e); }

      setShowAddShopping(false);
      setShopFilter('');
    } catch (e) { alert('Add failed: ' + e.message); }
  };

  const addCustom = async () => {
    if (!customDraft.name.trim()) return;
    const newRow = {
      session_id: session.id,
      item_id: null,
      item_name: customDraft.name.trim(),
      category: customDraft.category,
      store: customDraft.store,
      unit: customDraft.unit,
      qty: Number(customDraft.qty) || 1,
      price: Number(customDraft.price) || 0,
      purchased_at: session.started_at || new Date().toISOString(),
    };
    try {
      const inserted = await db.insertPurchase(newRow);
      const row = inserted?.[0] || newRow;
      const updated = [...purchases, row];
      setPurchases(updated);
      recalcTotal(updated);
      setShowAddCustom(false);
      setCustomDraft({ name: '', store: '', qty: 1, price: 0, category: 'Other', unit: 'ct' });
    } catch (e) { alert('Add failed: ' + e.message); }
  };

  // Group purchases by store
  const byStore = purchases.reduce((a, p) => {
    const s = p.store || 'Other';
    (a[s] = a[s] || []).push(p);
    return a;
  }, {});

  const total = purchases.reduce((s, r) => s + Number(r.price || 0) * Number(r.qty || 1), 0);

  // Inventory items not yet in this session
  const purchasedIds = new Set(purchases.map(p => p.item_id).filter(Boolean));
  const availableInv = inventoryItems
    .filter(it => !purchasedIds.has(it.id))
    .filter(it => !invFilter || it.name.toLowerCase().includes(invFilter.toLowerCase()))
    .sort((a, b) => a.name.localeCompare(b.name));

  // Shopping list items = inventory items currently below par level (out or low)
  // and not already in this session. These are items that need to be bought —
  // useful when a receipt didn't itemize them and you want to mark them as purchased.
  const shoppingListInv = inventoryItems
    .filter(it => !purchasedIds.has(it.id))
    .filter(it => Number(it.current_qty || 0) < Number(it.par_level || 0))
    .filter(it => !shopFilter || it.name.toLowerCase().includes(shopFilter.toLowerCase()))
    .sort((a, b) => {
      // out first, then low
      const aOut = Number(a.current_qty || 0) === 0;
      const bOut = Number(b.current_qty || 0) === 0;
      if (aOut !== bOut) return aOut ? -1 : 1;
      return a.name.localeCompare(b.name);
    });

  const inp = { width: '100%', fontSize: 12, padding: '5px 7px', borderRadius: 6, border: '1px solid var(--bd)', background: 'var(--card)', color: 'var(--tx)', boxSizing: 'border-box' };

  return (
    <div style={{ marginTop: 12, padding: 12, background: 'var(--card)', borderRadius: 10, border: '1px solid var(--bd)' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>

                      <div style={{ fontSize: 10, color: 'var(--tx2)' }}>
                        {p.qty} {p.unit || 'ct'} × ${Number(p.price).toFixed(2)} = <b>${(Number(p.qty) * Number(p.price)).toFixed(2)}</b>

                    <button onClick={() => removeRow(p)} style={{ background: 'none', border: 'none', color: 'var(--mu)', cursor: 'pointer', fontSize: 18, padding: 4, flexShrink: 0 }}>×</button>

                  <div style={{ display: 'grid', gap: 6 }}>
                    <input style={inp} value={draft.name} onChange={e => setDraft(p => ({ ...p, name: e.target.value }))} placeholder="Name" />
                    <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr 1fr', gap: 6 }}>
                      <select style={inp} value={draft.store} onChange={e => setDraft(p => ({ ...p, store: e.target.value }))}>
                        <option value="">— Store —</option>
                        {STORES.map(s => <option key={s}>{s}</option>)}
                      </select>
                      <input style={inp} type="number" step="0.5" value={draft.qty} onChange={e => setDraft(p => ({ ...p, qty: e.target.value }))} placeholder="Qty" />
                      <input style={inp} type="number" step="0.01" value={draft.price} onChange={e => setDraft(p => ({ ...p, price: e.target.value }))} placeholder="Price" />
                    </div>
                    <div style={{ display: 'flex', gap: 6 }}>
                      <button className="btn-gh" style={{ flex: 1, fontSize: 11, padding: '5px 8px' }} onClick={() => setEditingId(null)}>Cancel</button>
                      <button className="btn-pr" style={{ flex: 2, fontSize: 11, padding: '5px 8px' }} onClick={() => saveEdit(p)}>Save</button>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      ))}

      {!loading && purchases.length === 0 && (
        <div style={{ fontSize: 11, color: 'var(--mu)', textAlign: 'center', padding: 12 }}>No items recorded for this trip.</div>
      )}

      {/* Add buttons */}
      <div style={{ display: 'flex', gap: 6, marginTop: 8, flexWrap: 'wrap' }}>
        <button className="btn-outline" style={{ flex: '1 1 0', minWidth: 100, fontSize: 11, padding: '6px 6px' }}
          onClick={() => { setShowAddShopping(!showAddShopping); setShowAddInventory(false); setShowAddCustom(false); }}>
          + Shopping List{shoppingListInv.length > 0 ? ` (${shoppingListInv.length})` : ''}
        </button>
        <button className="btn-outline" style={{ flex: '1 1 0', minWidth: 100, fontSize: 11, padding: '6px 6px' }}
          onClick={() => { setShowAddInventory(!showAddInventory); setShowAddShopping(false); setShowAddCustom(false); }}>
          + Inventory
        </button>
        <button className="btn-outline" style={{ flex: '1 1 0', minWidth: 100, fontSize: 11, padding: '6px 6px' }}
          onClick={() => { setShowAddCustom(!showAddCustom); setShowAddInventory(false); setShowAddShopping(false); }}>
          + Custom
        </button>
      </div>

      {/* Add from shopping list picker — shows out/low items only */}
      {showAddShopping && (
        <div style={{ marginTop: 8, padding: 10, background: 'var(--bg)', borderRadius: 8 }}>
          <div style={{ fontSize: 10, color: 'var(--tx2)', marginBottom: 6, lineHeight: 1.4 }}>
            Items currently out or low. Adding restocks inventory to par and removes from shopping list.
          </div>
          <input className="inp" value={shopFilter} onChange={e => setShopFilter(e.target.value)}
            placeholder="Search shopping list…" style={{ fontSize: 12, marginBottom: 8 }} />
          <div style={{ maxHeight: 220, overflowY: 'auto' }}>
            {shoppingListInv.length === 0 && <div style={{ fontSize: 11, color: 'var(--mu)', textAlign: 'center', padding: 6 }}>Nothing on the shopping list right now</div>}
            {shoppingListInv.slice(0, 50).map(it => {
              const isOut = Number(it.current_qty || 0) === 0;
              const fillQty = Math.max(1, it.par_level - it.current_qty);
              return (
                <div key={it.id} onClick={() => addFromShoppingList(it)} style={{
                  padding: '6px 8px', cursor: 'pointer', borderRadius: 6, fontSize: 12,
                  display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 6,
                }}
                  onMouseEnter={e => e.currentTarget.style.background = 'var(--card)'}
                  onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                      <span style={{ fontWeight: 600 }}>{it.name}</span>
                      <span style={{
                        fontSize: 9, fontWeight: 700, padding: '1px 5px', borderRadius: 3,
                        background: isOut ? 'var(--er)' : 'var(--wa)', color: '#fff',
                      }}>{isOut ? 'OUT' : 'LOW'}</span>
                    </div>
                    <div style={{ fontSize: 10, color: 'var(--mu)' }}>
                      {it.store} · need {fillQty} {it.unit || 'ct'} · ${Number(it.price || 0).toFixed(2)}
                    </div>
                  </div>
                  <span style={{ fontSize: 14, color: 'var(--pr)', flexShrink: 0 }}>+</span>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Add from inventory picker */}
      {showAddInventory && (
        <div style={{ marginTop: 8, padding: 10, background: 'var(--bg)', borderRadius: 8 }}>
          <input className="inp" value={invFilter} onChange={e => setInvFilter(e.target.value)}
            placeholder="Search inventory…" style={{ fontSize: 12, marginBottom: 8 }} />
          <div style={{ maxHeight: 200, overflowY: 'auto' }}>
            {availableInv.length === 0 && <div style={{ fontSize: 11, color: 'var(--mu)', textAlign: 'center', padding: 6 }}>No matches</div>}
            {availableInv.slice(0, 30).map(it => (
              <div key={it.id} onClick={() => addFromInventory(it)} style={{
                padding: '6px 8px', cursor: 'pointer', borderRadius: 6, fontSize: 12,
                display: 'flex', justifyContent: 'space-between', alignItems: 'center',
              }}
                onMouseEnter={e => e.currentTarget.style.background = 'var(--card)'}
                onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                <div>
                  <div style={{ fontWeight: 600 }}>{it.name}</div>
                  <div style={{ fontSize: 10, color: 'var(--mu)' }}>{it.store} · ${Number(it.price || 0).toFixed(2)}</div>
                </div>
                <span style={{ fontSize: 14, color: 'var(--pr)' }}>+</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Add custom item form */}
      {showAddCustom && (
        <div style={{ marginTop: 8, padding: 10, background: 'var(--bg)', borderRadius: 8, display: 'grid', gap: 6 }}>
          <input style={inp} value={customDraft.name} onChange={e => setCustomDraft(p => ({ ...p, name: e.target.value }))} placeholder="Item name" autoFocus />
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6 }}>
            <select style={inp} value={customDraft.store} onChange={e => setCustomDraft(p => ({ ...p, store: e.target.value }))}>
              <option value="">— Store —</option>
              {STORES.map(s => <option key={s}>{s}</option>)}
            </select>
            <select style={inp} value={customDraft.category} onChange={e => setCustomDraft(p => ({ ...p, category: e.target.value }))}>
              {CATS.map(c => <option key={c}>{c}</option>)}
            </select>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 6 }}>
            <input style={inp} type="number" step="0.5" value={customDraft.qty} onChange={e => setCustomDraft(p => ({ ...p, qty: e.target.value }))} placeholder="Qty" />
            <select style={inp} value={customDraft.unit} onChange={e => setCustomDraft(p => ({ ...p, unit: e.target.value }))}>
              {UNITS.map(u => <option key={u}>{u}</option>)}
            </select>
            <input style={inp} type="number" step="0.01" value={customDraft.price} onChange={e => setCustomDraft(p => ({ ...p, price: e.target.value }))} placeholder="$ Price" />
          </div>
          <div style={{ display: 'flex', gap: 6, marginTop: 4 }}>
            <button className="btn-gh" style={{ flex: 1, fontSize: 11, padding: '5px 8px' }} onClick={() => setShowAddCustom(false)}>Cancel</button>
            <button className="btn-pr" style={{ flex: 2, fontSize: 11, padding: '5px 8px' }} onClick={addCustom} disabled={!customDraft.name.trim()}>Add Item</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ─── SESSION RECEIPTS UPLOADER ─── */
// Allows uploading multiple receipt photos per session, OCRing each, summing actual totals.
function SessionReceipts({ session, sessionId, estimatedTotal, onTotalChange, inventoryItems, onInventoryUpdate, onPurchasesChanged }) {
  const [receipts, setReceipts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [uploading, setUploading] = useState(false);
  const [progress, setProgress] = useState({ current: 0, total: 0, label: '' });
  // multiPage = true means all selected files are pages of ONE long receipt;
  // false means each file is a separate receipt.
  const [multiPage, setMultiPage] = useState(false);
  const [showOptions, setShowOptions] = useState(false);
  // Per-receipt session-purchase attachment state
  const [attachingId, setAttachingId] = useState(null);
  const [attachFilter, setAttachFilter] = useState('');
  const [sessionPurchases, setSessionPurchases] = useState([]);
  const fileRef = useRef(null);

  useEffect(() => {
    db.getSessionReceipts(sessionId).then(rows => {
      setReceipts(rows || []);
      setLoading(false);
      const total = (rows || []).reduce((s, r) => s + Number(r.total || 0), 0);
      onTotalChange?.(total);
    }).catch(() => setLoading(false));
  }, [sessionId]);

  // Refresh session purchases when opening the attach panel — these are the
  // candidate items that can be linked to a receipt missing line items.
  const refreshSessionPurchases = async () => {
    try {
      const rows = await db.getSessionPurchases(sessionId);
      setSessionPurchases(rows || []);
    } catch {}
  };

  const compressImage = (file, maxDim = 1600, quality = 0.85) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = h * (maxDim / w); w = maxDim; } else { w = w * (maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        canvas.toBlob(b => resolve({ blob: b, dataUrl }), 'image/jpeg', quality);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });

  // Process a single receipt = N images sent to OCR together.
  // The API combines them into one parsed result.
  const processSingleReceipt = async (files, baseIdx = 0) => {
    // Compress all images first
    const compressed = [];
    for (let j = 0; j < files.length; j++) {
      setProgress({ current: baseIdx + 1, total: 0, label: `Compressing page ${j + 1}/${files.length}…` });
      const c = await compressImage(files[j]);
      compressed.push(c);
    }
    // Send all base64 images in one request
    setProgress({ current: baseIdx + 1, total: 0, label: `Reading receipt (${files.length} page${files.length > 1 ? 's' : ''})…` });
    const ocrResp = await window.appAuth.authFetch('/api/receipt-ocr', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        mode: 'receipt',
        // Send first as `image` (legacy single) AND all as `images` array
        image: compressed[0].dataUrl.split(',')[1],
        images: compressed.map(c => c.dataUrl.split(',')[1]),
        mediaType: 'image/jpeg',
      }),
    });
    if (!ocrResp.ok) throw new Error('OCR failed');
    const parsed = await ocrResp.json();
    const items = parsed.items || [];
    const subtotal = parsed.subtotal != null ? Number(parsed.subtotal) : null;
    const tax = parsed.tax != null ? Number(parsed.tax) : null;
    const total = parsed.total != null
      ? Number(parsed.total)
      : (subtotal != null && tax != null
        ? subtotal + tax
        : items.reduce((s, it) => s + (Number(it.price) || 0) * (Number(it.qty) || 1), 0));

    // Upload first photo as the cover, rest as additional pages
    let photoUrl = null;
    const additionalPhotos = [];
    for (let j = 0; j < compressed.length; j++) {
      try {
        const path = `${sessionId}/${Date.now()}-${baseIdx}-p${j}.jpg`;
        const url = await db.uploadFile('receipts', path, compressed[j].blob);
        if (j === 0) photoUrl = url;
        else additionalPhotos.push(url);
      } catch {}
    }

    const inserted = await db.insertSessionReceipt({
      session_id: sessionId,
      store_guess: parsed.store_guess || null,
      subtotal,
      tax,
      total,
      item_count: items.length,
      photo_url: photoUrl,
      raw_items: additionalPhotos.length
        ? { items, additional_photos: additionalPhotos }
        : items,
    });
    return inserted?.[0] || null;
  };

  const handleFiles = async (files) => {
    if (!files?.length) return;
    setUploading(true);
    const newRows = [];

    if (multiPage) {
      // All files = pages of one receipt
      setProgress({ current: 1, total: 1, label: 'Processing combined receipt…' });
      try {
        const row = await processSingleReceipt(files, 0);
        if (row) newRows.push(row);
      } catch (err) { console.error('Receipt upload failed:', err); alert('Could not process receipt — try again or split into separate receipts'); }
    } else {
      // Each file is its own receipt
      setProgress({ current: 0, total: files.length, label: '' });
      for (let i = 0; i < files.length; i++) {
        setProgress({ current: i + 1, total: files.length, label: '' });
        try {
          const row = await processSingleReceipt([files[i]], i);
          if (row) newRows.push(row);
        } catch (err) { console.error('Receipt upload failed:', err); }
      }
    }

    const updated = [...newRows, ...receipts];
    setReceipts(updated);
    const newTotal = updated.reduce((s, r) => s + Number(r.total || 0), 0);
    onTotalChange?.(newTotal);
    setUploading(false);
    setProgress({ current: 0, total: 0, label: '' });
  };

  const removeReceipt = async (id) => {
    if (!confirm('Remove this receipt?')) return;
    try { await db.deleteSessionReceipt(id); } catch {}
    const updated = receipts.filter(r => r.id !== id);
    setReceipts(updated);
    const newTotal = updated.reduce((s, r) => s + Number(r.total || 0), 0);
    onTotalChange?.(newTotal);
  };

  // Toggle a session-purchase row's link to a receipt. When linked,
  // the receipt records that this purchase belongs to it.
  const toggleAttach = async (receipt, purchaseId) => {
    const current = Array.isArray(receipt.linked_purchase_ids) ? receipt.linked_purchase_ids : [];
    const isLinked = current.includes(purchaseId);
    const next = isLinked ? current.filter(id => id !== purchaseId) : [...current, purchaseId];
    try {
      await db.updateSessionReceipt(receipt.id, { linked_purchase_ids: next });
      setReceipts(p => p.map(r => r.id === receipt.id ? { ...r, linked_purchase_ids: next } : r));
    } catch (e) { alert('Update failed: ' + e.message); }
  };

  // Attach an inventory item that's still on the shopping list (out/low) to a receipt.
  // Creates a purchase row, bumps inventory to par, and links the new purchase to the receipt.
  const attachShoppingItem = async (receipt, item) => {
    const fillQty = Math.max(1, item.par_level - item.current_qty);
    const newRow = {
      session_id: sessionId,
      item_id: item.id,
      item_name: item.name,
      category: item.category,
      store: item.store,
      unit: item.unit,
      qty: fillQty,
      price: Number(item.price || 0),
      purchased_at: session?.started_at || new Date().toISOString(),
    };
    try {
      const inserted = await db.insertPurchase(newRow);
      const purchase = inserted?.[0] || newRow;
      // Bump inventory
      const invFields = { current_qty: item.par_level, checked_at: null, session_id: null };
      try {
        await db.update(item.id, invFields);
        onInventoryUpdate?.(item.id, invFields);
      } catch {}
      // Link to receipt
      const current = Array.isArray(receipt.linked_purchase_ids) ? receipt.linked_purchase_ids : [];
      const next = [...current, purchase.id];
      try {
        await db.updateSessionReceipt(receipt.id, { linked_purchase_ids: next });
        setReceipts(p => p.map(r => r.id === receipt.id ? { ...r, linked_purchase_ids: next } : r));
      } catch {}
      // Refresh local sessionPurchases so the row appears in the toggle list
      await refreshSessionPurchases();
      // Tell parent so SessionPurchaseEditor refetches too
      onPurchasesChanged?.();
    } catch (e) { alert('Attach failed: ' + e.message); }
  };

  const subtotalSum = receipts.reduce((s, r) => s + Number(r.subtotal || 0), 0);
  const taxSum = receipts.reduce((s, r) => s + Number(r.tax || 0), 0);
  const actualTotal = receipts.reduce((s, r) => s + Number(r.total || 0), 0);
  const variance = estimatedTotal > 0 ? actualTotal - estimatedTotal : null;
  // Only show subtotal/tax breakdown if at least one receipt has them
  const hasBreakdown = receipts.some(r => r.subtotal != null || r.tax != null);

  // Items still on the shopping list (out/low) that could be attached
  const purchasedItemIds = new Set(sessionPurchases.map(p => p.item_id).filter(Boolean));
  const shoppingListInv = (inventoryItems || [])
    .filter(it => !purchasedItemIds.has(it.id))
    .filter(it => Number(it.current_qty || 0) < Number(it.par_level || 0))
    .filter(it => !attachFilter || it.name.toLowerCase().includes(attachFilter.toLowerCase()))
    .sort((a, b) => a.name.localeCompare(b.name));

  return (
    <div style={{ marginTop: 12, padding: 12, background: 'var(--card)', borderRadius: 10, border: '1px solid var(--bd)' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
        <div>
          <div style={{ fontSize: 13, fontWeight: 700 }}>Receipts ({receipts.length})</div>
          <div style={{ fontSize: 11, color: 'var(--tx2)' }}>Actual cost from uploaded receipts</div>
        </div>
        <div style={{ textAlign: 'right' }}>
          <div style={{ fontSize: 16, fontWeight: 800, color: 'var(--pr)' }}>${actualTotal.toFixed(2)}</div>
          {hasBreakdown && (
            <div style={{ fontSize: 10, color: 'var(--tx2)', marginTop: 2 }}>
              Food <b style={{ color: 'var(--tx)' }}>${subtotalSum.toFixed(2)}</b>
              {' · '}Tax <b style={{ color: 'var(--tx)' }}>${taxSum.toFixed(2)}</b>
            </div>
          )}
          {estimatedTotal > 0 && variance != null && (
            <div style={{ fontSize: 10, color: variance > 0 ? 'var(--er)' : 'var(--ok)', fontWeight: 600 }}>
              {variance > 0 ? '+' : ''}${variance.toFixed(2)} vs est ${estimatedTotal.toFixed(2)}
            </div>
          )}
        </div>
      </div>

      {loading && <div style={{ fontSize: 11, color: 'var(--mu)', textAlign: 'center', padding: 8 }}>Loading…</div>}

      {receipts.length > 0 && (
        <div style={{ marginBottom: 10 }}>
          {receipts.map(r => {
            const linkedIds = Array.isArray(r.linked_purchase_ids) ? r.linked_purchase_ids : [];
            const linkedRows = sessionPurchases.filter(p => linkedIds.includes(p.id));
            const isAttaching = attachingId === r.id;
            const itemsArr = Array.isArray(r.raw_items) ? r.raw_items : (r.raw_items?.items || []);
            const additionalPhotos = (r.raw_items?.additional_photos) || [];
            const itemCount = (r.item_count || itemsArr.length || 0);
            return (
              <div key={r.id} style={{ borderBottom: '1px solid var(--bd)', padding: '8px 0' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                  {r.photo_url ? (
                    <PrivateImage bucket="receipts" path={r.photo_url} openOnClick alt="receipt" style={{ width: 36, height: 36, objectFit: 'cover', borderRadius: 6, border: '1px solid var(--bd)', cursor: 'pointer' }} />
                  ) : (
                    <div style={{ width: 36, height: 36, borderRadius: 6, background: 'var(--bg)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14 }}>📄</div>
                  )}
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 12, fontWeight: 600 }}>
                      {r.store_guess || 'Receipt'}
                      {additionalPhotos.length > 0 && (
                        <span style={{ fontSize: 9, fontWeight: 700, marginLeft: 6, padding: '1px 5px', borderRadius: 3, background: 'var(--bd)', color: 'var(--tx2)' }}>
                          {additionalPhotos.length + 1} pages
                        </span>
                      )}
                    </div>
                    <div style={{ fontSize: 10, color: 'var(--mu)' }}>
                      {itemCount} item{itemCount !== 1 ? 's' : ''}
                      {linkedRows.length > 0 && ` · ${linkedRows.length} attached`}
                      {' · '}{new Date(r.uploaded_at).toLocaleDateString()}
                    </div>
                    {(r.subtotal != null || r.tax != null) && (
                      <div style={{ fontSize: 10, color: 'var(--tx2)' }}>
                        {r.subtotal != null && <>Food ${Number(r.subtotal).toFixed(2)}</>}
                        {r.subtotal != null && r.tax != null && ' · '}
                        {r.tax != null && <>Tax ${Number(r.tax).toFixed(2)}</>}
                      </div>
                    )}
                  </div>
                  <div style={{ fontSize: 13, fontWeight: 700, color: 'var(--pr)', flexShrink: 0 }}>${Number(r.total).toFixed(2)}</div>
                  <button onClick={() => removeReceipt(r.id)} style={{ background: 'none', border: 'none', color: 'var(--mu)', cursor: 'pointer', fontSize: 16, padding: 4 }}>×</button>
                </div>

                {/* Additional page thumbnails */}
                {additionalPhotos.length > 0 && (
                  <div style={{ display: 'flex', gap: 4, marginTop: 6, marginLeft: 46, flexWrap: 'wrap' }}>
                    {additionalPhotos.map((url, i) => (
                      <img key={i} src={url} alt={`page ${i + 2}`}
                        style={{ width: 28, height: 28, objectFit: 'cover', borderRadius: 4, border: '1px solid var(--bd)', cursor: 'pointer' }}
                        onClick={() => window.open(url, '_blank')} />
                    ))}
                  </div>
                )}

                {/* Linked items chips */}
                {linkedRows.length > 0 && (
                  <div style={{ marginTop: 6, marginLeft: 46, display: 'flex', flexWrap: 'wrap', gap: 4 }}>
                    {linkedRows.map(lr => (
                      <span key={lr.id} style={{
                        fontSize: 10, padding: '2px 6px', borderRadius: 10,
                        background: 'var(--prl)', color: 'var(--pr)', fontWeight: 600,
                      }}>
                        {lr.item_name} · ${Number(lr.price * lr.qty).toFixed(2)}
                      </span>
                    ))}
                  </div>
                )}

                {/* Attach toggle button */}
                <div style={{ marginTop: 6, marginLeft: 46 }}>
                  <button onClick={async () => {
                    if (isAttaching) { setAttachingId(null); return; }
                    setAttachingId(r.id);
                    setAttachFilter('');
                    await refreshSessionPurchases();
                  }} style={{
                    fontSize: 10, padding: '3px 8px', borderRadius: 4,
                    border: '1px solid var(--bd)', background: 'transparent',
                    color: 'var(--tx2)', cursor: 'pointer',
                  }}>
                    {isAttaching ? 'Done' : '🔗 Attach items'}
                  </button>
                </div>

                {/* Attach panel */}
                {isAttaching && (
                  <div style={{ marginTop: 8, marginLeft: 46, padding: 10, background: 'var(--bg)', borderRadius: 8 }}>
                    <div style={{ fontSize: 10, color: 'var(--tx2)', lineHeight: 1.4, marginBottom: 8 }}>
                      Attach items to this receipt. Useful for receipts that don't itemize (e.g. African Store).
                    </div>

                    {/* Items already in session — toggle to link/unlink */}
                    {sessionPurchases.length > 0 && (
                      <div style={{ marginBottom: 10 }}>
                        <div style={{ fontSize: 10, fontWeight: 700, color: 'var(--tx2)', textTransform: 'uppercase', letterSpacing: 1, marginBottom: 4 }}>From this trip</div>
                        <div style={{ maxHeight: 140, overflowY: 'auto' }}>
                          {sessionPurchases.map(sp => {
                            const isLinked = linkedIds.includes(sp.id);
                            return (
                              <div key={sp.id} onClick={() => toggleAttach(r, sp.id)} style={{
                                padding: '5px 7px', cursor: 'pointer', borderRadius: 4, fontSize: 11,
                                display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                                background: isLinked ? 'var(--prl)' : 'transparent', marginBottom: 2,
                              }}>
                                <span style={{ fontWeight: isLinked ? 700 : 400 }}>
                                  {isLinked ? '✓ ' : '○ '}{sp.item_name}
                                </span>
                                <span style={{ fontSize: 10, color: 'var(--mu)' }}>
                                  {sp.store} · ${(Number(sp.price) * Number(sp.qty)).toFixed(2)}
                                </span>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    )}

                    {/* Shopping list items — adds + links */}
                    <div>
                      <div style={{ fontSize: 10, fontWeight: 700, color: 'var(--tx2)', textTransform: 'uppercase', letterSpacing: 1, marginBottom: 4 }}>Add from shopping list</div>
                      <input className="inp" value={attachFilter} onChange={e => setAttachFilter(e.target.value)}
                        placeholder="Search…" style={{ fontSize: 11, marginBottom: 6, padding: '4px 6px' }} />
                      <div style={{ maxHeight: 160, overflowY: 'auto' }}>
                        {shoppingListInv.length === 0 && (
                          <div style={{ fontSize: 10, color: 'var(--mu)', textAlign: 'center', padding: 6 }}>
                            Nothing on the shopping list
                          </div>
                        )}
                        {shoppingListInv.slice(0, 30).map(it => {
                          const isOut = Number(it.current_qty || 0) === 0;
                          return (
                            <div key={it.id} onClick={() => attachShoppingItem(r, it)} style={{
                              padding: '5px 7px', cursor: 'pointer', borderRadius: 4, fontSize: 11,
                              display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                            }}>
                              <span>
                                <span style={{
                                  fontSize: 8, fontWeight: 700, padding: '1px 4px', borderRadius: 3,
                                  background: isOut ? 'var(--er)' : 'var(--wa)', color: '#fff', marginRight: 5,
                                }}>{isOut ? 'OUT' : 'LOW'}</span>
                                {it.name}
                              </span>
                              <span style={{ color: 'var(--pr)', fontSize: 13 }}>+</span>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {/* Upload options */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 6 }}>
        <button onClick={() => setShowOptions(!showOptions)} style={{
          fontSize: 10, color: 'var(--tx2)', background: 'none', border: 'none',
          cursor: 'pointer', padding: 0,
        }}>
          {showOptions ? '▾' : '▸'} Options {multiPage ? '· Multi-page mode' : ''}
        </button>
      </div>
      {showOptions && (
        <div style={{ background: 'var(--bg)', padding: 10, borderRadius: 8, marginBottom: 8 }}>
          <label style={{ display: 'flex', alignItems: 'flex-start', gap: 8, cursor: 'pointer', fontSize: 11 }}>
            <input type="checkbox" checked={multiPage} onChange={e => setMultiPage(e.target.checked)} style={{ marginTop: 2 }} />
            <div>
              <div style={{ fontWeight: 600 }}>Multi-page receipt</div>
              <div style={{ fontSize: 10, color: 'var(--tx2)', marginTop: 2, lineHeight: 1.4 }}>
                Combine all selected photos into ONE receipt (for long receipts that need several pictures). Otherwise each photo is its own receipt.
              </div>
            </div>
          </label>
        </div>
      )}

      <input ref={fileRef} type="file" accept="image/*" multiple style={{ display: 'none' }}
        onChange={(e) => { handleFiles(Array.from(e.target.files || [])); e.target.value = ''; }} />
      <button className="btn-outline" style={{ width: '100%', fontSize: 12 }}
        onClick={() => fileRef.current?.click()} disabled={uploading}>
        {uploading
          ? (progress.label || `Processing ${progress.current}/${progress.total}…`)
          : (multiPage ? '+ Add Multi-Page Receipt' : '+ Add Receipt(s)')}
      </button>
    </div>
  );
}

/* ─── HISTORY ─── */
function HistoryView({ sessions, onSessionUpdate, inventoryItems, onInventoryUpdate }) {
  const [expandId, setExpandId] = useState(null);
  const [notes, setNotes] = useState({});
  const [payments, setPayments] = useState([]);
  const [loadingPay, setLoadingPay] = useState(true);
  const [showPayForm, setShowPayForm] = useState(false);
  const [payAmount, setPayAmount] = useState('');
  const [payNote, setPayNote] = useState('');
  const [showPayLog, setShowPayLog] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [editMiles, setEditMiles] = useState({ start: '', end: '', driver: '' });
  // Per-session refresh tick — bumped when one child component changes data the other reads.
  // E.g. attaching a shopping-list item from SessionReceipts creates a purchase row that
  // SessionPurchaseEditor needs to re-fetch.
  const [purchaseRefresh, setPurchaseRefresh] = useState({});
  const bumpPurchaseRefresh = (sid) => setPurchaseRefresh(p => ({ ...p, [sid]: (p[sid] || 0) + 1 }));

  const openEdit = (s) => {
    const miles = mileageStore.get(s);
    setEditMiles({
      start: miles.start_miles ?? '',
      end: miles.end_miles ?? '',
      driver: miles.driver ?? '',
    });
    setEditingId(s.id);
  };

  const saveEdit = async (s) => {
    const data = {};
    if (editMiles.start !== '') data.start_miles = Number(editMiles.start);
    if (editMiles.end !== '') data.end_miles = Number(editMiles.end);
    if (editMiles.driver) data.driver = editMiles.driver;
    await mileageStore.save(s.id, data);
    if (onSessionUpdate) onSessionUpdate(s.id, {
      start_miles: data.start_miles,
      end_miles: data.end_miles,
      driver_name: editMiles.driver || s.driver_name,
    });
    setEditingId(null);
  };

  useEffect(() => {
    (async () => {
      try { const d = await db.getPayments(); setPayments(d || []); } catch {}
      setLoadingPay(false);
    })();
  }, []);

  // Compute totals
  const totalEarned = sessions.filter(s => s.ended_at && s.driver_role !== 'owner').reduce((sum, s) => {
    const hrs = (new Date(s.ended_at) - new Date(s.started_at)) / 3600000;
    const mi = mileageStore.get(s);
    const miles = mi.start_miles && mi.end_miles ? Number(mi.end_miles) - Number(mi.start_miles) : null;
    return sum + window.calcDriverPay(hrs, miles).total;
  }, 0);
  const totalPaid = payments.reduce((s, p) => s + Number(p.amount || 0), 0);
  const unpaidBalance = totalEarned - totalPaid;

  const recordPayment = async () => {
    const amt = Number(payAmount);
    if (!amt || amt <= 0) return;
    try {
      const inserted = await db.addPayment({ amount: amt, note: payNote || null, paid_at: new Date().toISOString() });
      setPayments(p => [...(inserted || []), ...p]);
      setShowPayForm(false);
      setPayAmount('');
      setPayNote('');
    } catch (e) { console.error(e); }
  };

  const markAllPaid = async () => {
    if (unpaidBalance <= 0) return;
    if (!confirm(`Mark $${unpaidBalance.toFixed(2)} as paid?`)) return;
    try {
      const inserted = await db.addPayment({ amount: unpaidBalance, note: 'Settled balance', paid_at: new Date().toISOString() });
      setPayments(p => [...(inserted || []), ...p]);
    } catch (e) { console.error(e); }
  };

  const undoPayment = async (id) => {
    if (!confirm('Delete this payment record?')) return;
    try {
      await db.deletePayment(id);
      setPayments(p => p.filter(x => x.id !== id));
    } catch (e) { console.error(e); }
  };

  const loadNotes = async (sid) => {
    if (notes[sid]) return;
    try {const n = await db.getSessionNotes(sid);setNotes((p) => ({ ...p, [sid]: n }));} catch {}
  };
  const toggle = (sid) => {if (expandId === sid) setExpandId(null);else {setExpandId(sid);loadNotes(sid);}};

  return (
    <div className="page">
      <div className="page-hdr"><div><div className="page-title">Trip History</div><div className="page-sub">{sessions.length} sessions · driver pay tracker</div></div></div>

      {/* Payment summary card */}
      <div className="card" style={{ padding: 18, marginBottom: 14, background: unpaidBalance > 0 ? 'linear-gradient(135deg, #fff7ed, #fff)' : 'linear-gradient(135deg, #f0fdf4, #fff)' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 14 }}>
          <div>
            <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--mu)', textTransform: 'uppercase', letterSpacing: 1.2 }}>Driver Balance</div>
            <div style={{ fontSize: 28, fontWeight: 800, color: unpaidBalance > 0 ? 'var(--pr)' : 'var(--ok)', marginTop: 2 }}>
              ${unpaidBalance.toFixed(2)}
            </div>
            <div style={{ fontSize: 11, color: 'var(--tx2)', marginTop: 2 }}>
              {unpaidBalance > 0 ? 'unpaid' : 'all settled'}
            </div>
          </div>
          {unpaidBalance > 0.01 && (
            <button onClick={markAllPaid} style={{
              padding: '8px 14px', borderRadius: 10, border: 'none', cursor: 'pointer',
              background: 'var(--ok)', color: '#fff', fontSize: 12, fontWeight: 700,
            }}>Mark All Paid</button>
          )}
        </div>

        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, fontSize: 12 }}>
          <div style={{ padding: 10, background: 'rgba(0,0,0,0.03)', borderRadius: 8 }}>
            <div style={{ color: 'var(--mu)', fontSize: 10, fontWeight: 700, textTransform: 'uppercase' }}>Total Earned</div>
            <div style={{ fontSize: 16, fontWeight: 700, marginTop: 2 }}>${totalEarned.toFixed(2)}</div>
          </div>
          <div style={{ padding: 10, background: 'rgba(0,0,0,0.03)', borderRadius: 8 }}>
            <div style={{ color: 'var(--mu)', fontSize: 10, fontWeight: 700, textTransform: 'uppercase' }}>Total Paid</div>
            <div style={{ fontSize: 16, fontWeight: 700, marginTop: 2 }}>${totalPaid.toFixed(2)}</div>
          </div>
        </div>

        <div style={{ display: 'flex', gap: 8, marginTop: 12 }}>
          <button onClick={() => setShowPayForm(!showPayForm)} className="btn-outline" style={{ flex: 1, fontSize: 12, padding: '8px' }}>
            {showPayForm ? 'Cancel' : '+ Log Partial Payment'}
          </button>
          {payments.length > 0 && (
            <button onClick={() => setShowPayLog(!showPayLog)} className="btn-gh" style={{ flex: 1, fontSize: 12, padding: '8px' }}>
              {showPayLog ? 'Hide Log' : `View Log (${payments.length})`}
            </button>
          )}
        </div>

        {showPayForm && (
          <div style={{ marginTop: 12, padding: 12, background: '#fff', borderRadius: 10, border: '1px solid var(--bd)' }}>
            <input type="number" step="0.01" className="inp" placeholder="Amount paid" value={payAmount} onChange={(e) => setPayAmount(e.target.value)} style={{ marginBottom: 8 }} autoFocus />
            <input type="text" className="inp" placeholder="Note (optional, e.g. Cash, Venmo)" value={payNote} onChange={(e) => setPayNote(e.target.value)} style={{ marginBottom: 8 }} />
            <button onClick={recordPayment} className="btn-full" disabled={!Number(payAmount)}>Record Payment</button>
          </div>
        )}

        {showPayLog && payments.length > 0 && (
          <div style={{ marginTop: 12, padding: 12, background: '#fff', borderRadius: 10, border: '1px solid var(--bd)' }}>
            <div style={{ fontSize: 12, fontWeight: 700, marginBottom: 8 }}>Payment Log</div>
            {payments.map(p => (
              <div key={p.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px 0', borderBottom: '1px solid var(--bd)' }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 13, fontWeight: 700 }}>${Number(p.amount).toFixed(2)}</div>
                  <div style={{ fontSize: 10, color: 'var(--mu)' }}>
                    {new Date(p.paid_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}
                    {p.note ? ` · ${p.note}` : ''}
                  </div>
                </div>
                <button onClick={() => undoPayment(p.id)} style={{ background: 'none', border: 'none', color: 'var(--er)', fontSize: 11, fontWeight: 700, cursor: 'pointer', padding: 4 }}>×</button>
              </div>
            ))}
          </div>
        )}
      </div>

      {!sessions.length && <div className="empty"><div className="empty-icon"></div><p>No trips recorded yet</p></div>}

      {sessions.map((s, idx) => {
        const open = expandId === s.id;
        const miles = mileageStore.get(s);
        const hrs = s.ended_at ? (new Date(s.ended_at) - new Date(s.started_at)) / 3600000 : null;
        const milesDriven = miles.start_miles && miles.end_miles ? Number(miles.end_miles) - Number(miles.start_miles) : null;
        const payBreakdown = hrs ? window.calcDriverPay(hrs, milesDriven) : null;
        const pay = payBreakdown ? payBreakdown.total.toFixed(2) : null;
        const sNotes = notes[s.id] || [];
        return (
          <div key={s.id} className="hist-card" style={{ animation: `rowIn .28s ${idx * .04}s both` }}>
            <div className="hist-main" onClick={() => toggle(s.id)}>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 14, fontWeight: 700 }}>{new Date(s.started_at).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}</div>
                <div style={{ fontSize: 11, color: 'var(--tx2)', marginTop: 2 }}>
                  {new Date(s.started_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}{s.ended_at ? ' → ' + new Date(s.ended_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ''}
                </div>
                <div style={{ display: 'flex', gap: 10, marginTop: 6, flexWrap: 'wrap' }}>
                  {s.item_count > 0 && <span style={{ fontSize: 11, color: 'var(--tx2)' }}>{s.item_count} items</span>}
                  {s.total_spent > 0 && <span style={{ fontSize: 11, fontWeight: 700, color: 'var(--pr)' }}>Groceries: ${Number(s.total_spent).toFixed(2)}</span>}
                  {pay && <span style={{ fontSize: 11, fontWeight: 700, color: 'var(--ok)' }}>Driver: ${pay}</span>}
                  {milesDriven && <span style={{ fontSize: 11, color: 'var(--tx2)' }}>{milesDriven} mi</span>}
                  {miles.driver && <span style={{ fontSize: 11, color: 'var(--mu)' }}>{miles.driver}</span>}
                </div>
              </div>
              <span style={{ fontSize: 11, fontWeight: 600, color: s.status === 'active' ? 'var(--ok)' : 'var(--mu)', marginTop: 2, flex: 'none' }}>{s.status}</span>
            </div>
            {open &&
            <div className="hist-det">
                {(pay || milesDriven) &&
              <div className="trip-box">
                    {hrs && <div className="trip-row"><span className="trip-lbl">Duration</span><span className="trip-val">{hrs.toFixed(1)}h</span></div>}
                    {milesDriven && <div className="trip-row"><span className="trip-lbl">Miles Driven</span><span className="trip-val">{milesDriven} mi</span></div>}
                    {s.total_spent > 0 && <div className="trip-row"><span className="trip-lbl">Groceries (estimated)</span><span className="trip-val">${Number(s.total_spent).toFixed(2)}</span></div>}
                    {s.driver_role !== 'owner' && payBreakdown && <div className="trip-row"><span className="trip-lbl">Time Pay (@$20/hr)</span><span className="trip-val">${payBreakdown.timePay.toFixed(2)}</span></div>}
                    {s.driver_role !== 'owner' && payBreakdown && milesDriven && <div className="trip-row"><span className="trip-lbl">Gas ({milesDriven} mi × ${window.GAS_RATE_PER_MILE.toFixed(4)})</span><span className="trip-val">${payBreakdown.gasPay.toFixed(2)}</span></div>}
                    {s.driver_role !== 'owner' && payBreakdown && <div className="trip-row"><span className="trip-lbl">Total Driver Pay</span><span className="trip-total">${pay}</span></div>}
                  </div>
              }

                {/* Mileage edit panel — owner can fix missing/wrong miles */}
                {s.driver_role !== 'owner' && (
                  <div style={{ marginTop: 12, padding: 12, background: 'var(--card)', borderRadius: 10, border: '1px solid var(--bd)' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: editingId === s.id ? 10 : 0 }}>
                      <div>
                        <div style={{ fontSize: 13, fontWeight: 700 }}>Trip Mileage</div>
                        <div style={{ fontSize: 11, color: 'var(--tx2)' }}>
                          {miles.start_miles ? `Start: ${miles.start_miles}` : 'No start miles'}
                          {miles.end_miles ? ` · End: ${miles.end_miles}` : ' · No end miles'}
                          {milesDriven ? ` · ${milesDriven.toFixed(1)} mi driven` : ''}
                        </div>
                      </div>
                      {editingId !== s.id && (
                        <button onClick={() => openEdit(s)} className="btn-outline" style={{ fontSize: 11, padding: '5px 10px' }}>
                          Edit
                        </button>
                      )}
                    </div>
                    {editingId === s.id && (
                      <div style={{ display: 'grid', gap: 8 }}>
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
                          <div>
                            <label style={{ fontSize: 10, color: 'var(--tx2)', display: 'block', marginBottom: 3 }}>Start odometer</label>
                            <input type="number" className="inp" value={editMiles.start}
                              onChange={(e) => setEditMiles(p => ({ ...p, start: e.target.value }))}
                              placeholder="e.g. 42350" style={{ fontSize: 12 }} />
                          </div>
                          <div>
                            <label style={{ fontSize: 10, color: 'var(--tx2)', display: 'block', marginBottom: 3 }}>End odometer</label>
                            <input type="number" className="inp" value={editMiles.end}
                              onChange={(e) => setEditMiles(p => ({ ...p, end: e.target.value }))}
                              placeholder="e.g. 42398" style={{ fontSize: 12 }} />
                          </div>
                        </div>
                        <div>
                          <label style={{ fontSize: 10, color: 'var(--tx2)', display: 'block', marginBottom: 3 }}>Driver name</label>
                          <input type="text" className="inp" value={editMiles.driver}
                            onChange={(e) => setEditMiles(p => ({ ...p, driver: e.target.value }))}
                            placeholder="Driver" style={{ fontSize: 12 }} />
                        </div>
                        <div style={{ display: 'flex', gap: 6, marginTop: 4 }}>
                          <button className="btn-gh" style={{ flex: 1, fontSize: 12 }} onClick={() => setEditingId(null)}>Cancel</button>
                          <button className="btn-pr" style={{ flex: 2, fontSize: 12 }} onClick={() => saveEdit(s)}>Save mileage</button>
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {/* Editable purchase log */}
                <SessionPurchaseEditor session={s} inventoryItems={inventoryItems || []} onTotalChange={() => {}} onInventoryUpdate={onInventoryUpdate} refreshTick={purchaseRefresh[s.id] || 0} />

                {/* Multi-receipt uploader for actual costs */}
                <SessionReceipts session={s} sessionId={s.id} estimatedTotal={Number(s.total_spent || 0)} onTotalChange={() => {}} inventoryItems={inventoryItems || []} onInventoryUpdate={onInventoryUpdate} onPurchasesChanged={() => bumpPurchaseRefresh(s.id)} />

                {sNotes.length > 0 && (
                  <div style={{ marginTop: 12 }}>
                    <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--tx2)', textTransform: 'uppercase', letterSpacing: 1, marginBottom: 6 }}>Shopper Notes</div>
                    {sNotes.map((n) =>
                      <div key={n.id} style={{ padding: '6px 0', borderBottom: '1px solid var(--bd)' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between' }}><span style={{ fontSize: 13, fontWeight: 600 }}>{n.item_name}</span><span style={{ fontSize: 11, color: 'var(--mu)' }}>{n.store}</span></div>
                        <p style={{ fontSize: 12, color: 'var(--tx2)', marginTop: 2 }}>"{n.note}"</p>
                      </div>
                    )}
                  </div>
                )}
              </div>
            }
          </div>);

      })}
    </div>);

}
