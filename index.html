<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Joe's Kitchen</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#F6F7F4;--card:#fff;--sb:#17211B;--pr:#247A52;--prl:#E9F6EF;--ok:#15803D;--okl:#F0FDF4;--wa:#B96812;--wal:#FFF8E8;--er:#C93636;--erl:#FEF2F2;--tx:#17201A;--tx2:#5C6961;--bd:#E1E7E2;--mu:#87948B;--sw:220px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
input,select,button,textarea{font-family:inherit}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
input[type=range]{-webkit-appearance:none;width:100%;height:5px;border-radius:3px;outline:none;cursor:pointer;background:var(--bd)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--pr);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2);cursor:pointer}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
@keyframes scanMove{0%{top:20%}50%{top:80%}100%{top:20%}}
@keyframes popIn{0%{opacity:0;transform:scale(.82)}60%{transform:scale(1.07)}100%{opacity:1;transform:scale(1)}}
@keyframes checkPop{0%{transform:scale(0) rotate(-20deg)}55%{transform:scale(1.25) rotate(4deg)}80%{transform:scale(.92)}100%{transform:scale(1) rotate(0deg)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 rgba(192,86,33,.35)}50%{box-shadow:0 0 0 6px rgba(192,86,33,0)}}
@keyframes badgePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(14px) scale(.95)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes statIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes rowIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sw);background:var(--sb);position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;z-index:100}
.sb-logo{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.07);transition:background .18s}
.sb-logo:hover{background:rgba(255,255,255,.03)}
.sb-logo h1{font-size:17px;font-weight:700;color:#F5E6D3;letter-spacing:-.3px}
.sb-logo p{font-size:9px;color:var(--mu);font-weight:700;letter-spacing:1.8px;text-transform:uppercase;margin-top:2px}
.sb-nav{flex:1;padding:10px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:rgba(255,255,255,.45);border:none;background:none;width:100%;text-align:left;transition:all .2s cubic-bezier(.4,0,.2,1);margin-bottom:1px;letter-spacing:.01em;transform:translateX(0)}
.nav-item:hover{background:rgba(255,255,255,.09);color:rgba(255,255,255,.85);transform:translateX(3px)}
.nav-item.active{background:var(--pr);color:#fff;font-weight:600;transform:translateX(0);box-shadow:0 3px 12px rgba(192,86,33,.4)}
.nav-icon{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.nav-badge{margin-left:auto;font-size:10px;font-weight:800;background:var(--er);color:#fff;padding:1px 6px;border-radius:10px}
.sb-footer{padding:12px;border-top:1px solid rgba(255,255,255,.07)}
.sb-sync{padding:7px 12px;font-size:11px;font-weight:600;color:rgba(255,255,255,.4);background:rgba(255,255,255,.06);border:none;border-radius:7px;cursor:pointer;width:100%;margin-bottom:8px;transition:background .18s,color .18s,transform .15s}
.sb-sync:hover{background:rgba(255,255,255,.12);color:rgba(255,255,255,.75);transform:translateY(-1px)}
.sb-sync:active{transform:scale(.97)}
.sb-user{display:flex;align-items:center;gap:10px;cursor:pointer;padding:8px 10px;border-radius:8px;transition:background .18s,transform .15s}
.sb-user:hover{background:rgba(255,255,255,.08);transform:translateX(2px)}
.u-av{width:30px;height:30px;border-radius:50%;background:var(--pr);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0}
.u-name{font-size:13px;font-weight:600;color:#F5E6D3}
.u-sub{font-size:10px;color:var(--mu)}
.main{margin-left:var(--sw);flex:1;min-height:100vh;padding-bottom:24px}
.mob-hdr{display:none;background:rgba(246,247,244,.94);backdrop-filter:blur(14px);padding:12px 16px;position:sticky;top:0;z-index:100;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd)}
.mob-hdr h1{font-size:16px;font-weight:750;color:var(--tx);letter-spacing:-.25px}
.mob-hdr-r{display:flex;gap:6px;align-items:center}
.m-chip{padding:3px 8px;border-radius:12px;font-size:10px;font-weight:800}
.m-chip-er{background:rgba(220,38,38,.3);color:#FCA5A5}
.m-chip-wa{background:rgba(217,119,6,.3);color:#FCD34D}
.bot-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--bd);z-index:100;padding:5px 10px max(5px,env(safe-area-inset-bottom));box-shadow:0 -8px 28px rgba(23,32,26,.08)}
.bn-inner{display:grid;grid-template-columns:repeat(5,1fr);max-width:520px;margin:0 auto;align-items:end}
.bn-item{display:flex;min-height:50px;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px;cursor:pointer;border:none;background:none;color:var(--mu);font-size:10px;font-weight:700;letter-spacing:.1px;min-width:0;transition:color .18s,transform .15s;position:relative;border-radius:12px}
.bn-item:hover{color:var(--tx2);transform:translateY(-1px)}
.bn-item:active{transform:scale(.9)}
.bn-item.active{color:var(--pr)}
.bn-icon{width:21px;height:21px;display:block}
.bn-dot{position:absolute;top:5px;left:calc(50% + 7px);min-width:16px;height:16px;padding:0 4px;border-radius:10px;background:var(--er);color:#fff;border:2px solid #fff;font-size:8px;line-height:12px}
.bn-scan{width:52px;height:52px;min-height:52px;margin:-16px auto 0;border-radius:18px;background:var(--pr);color:#fff;box-shadow:0 7px 20px rgba(36,122,82,.28)}
.bn-scan:hover,.bn-scan.active{color:#fff;background:#1E6846;transform:translateY(-2px)}
.bn-scan .bn-icon{width:23px;height:23px}
.mobile-sheet-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,18,.42);z-index:140;animation:fadeIn .18s ease}
.mobile-sheet{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:10px;box-shadow:0 24px 70px rgba(15,23,18,.24);animation:slideUp .22s ease}
.mobile-sheet-handle{width:36px;height:4px;border-radius:3px;background:var(--bd);margin:2px auto 12px}
.mobile-sheet-head{padding:0 8px 10px;font-size:12px;font-weight:800;color:var(--tx2);text-transform:uppercase;letter-spacing:.7px}
.mobile-sheet-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.mobile-sheet-item{min-height:58px;border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:13px;font-weight:700;cursor:pointer;text-align:left}
.mobile-sheet-item:active{transform:scale(.98);background:var(--prl)}
.mobile-sheet-item svg{width:20px;height:20px;color:var(--pr)}
.mobile-sheet-close{width:100%;min-height:44px;margin-top:8px;border:none;border-radius:13px;background:var(--bg);color:var(--tx2);font-weight:700;cursor:pointer}
.bn-item:focus-visible,.mobile-sheet-item:focus-visible,.mobile-sheet-close:focus-visible{outline:3px solid rgba(36,122,82,.3);outline-offset:2px}
.page{padding:24px;max-width:860px;animation:pageIn .25s cubic-bezier(.4,0,.2,1)}
.today-head{margin-bottom:18px}
.today-eyebrow{font-size:11px;color:var(--tx2);font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.today-title{font-size:28px;font-weight:700;letter-spacing:-.8px;line-height:1.12}
.today-sub{font-size:13px;color:var(--tx2);margin-top:5px}
.today-hero{background:var(--prl);border:1px solid #CFE8DA;border-radius:18px;padding:20px;margin-bottom:18px}
.today-hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.today-hero-label{font-size:11px;color:var(--tx2);font-weight:700;text-transform:uppercase;letter-spacing:.7px}
.today-hero-count{font-size:34px;font-weight:700;letter-spacing:-1.2px;margin-top:3px}
.today-auto{display:inline-flex;align-items:center;gap:6px;background:var(--card);color:var(--tx2);border-radius:999px;padding:6px 10px;font-size:10px;font-weight:700;white-space:nowrap}
.today-auto svg{width:14px;height:14px;color:var(--pr)}
.today-primary{width:100%;min-height:48px;margin-top:16px;border:0;border-radius:11px;background:var(--pr);color:#fff;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .18s,transform .15s}
.today-primary:hover{background:#1E6846;transform:translateY(-1px)}
.today-primary svg{width:18px;height:18px}
.today-section{margin-top:18px}
.today-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 8px}
.today-section-title{font-size:14px;font-weight:700}
.today-link{border:0;background:none;color:var(--pr);font-size:12px;font-weight:700;cursor:pointer;padding:5px}
.today-list{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.today-row{display:flex;align-items:center;gap:12px;padding:13px;border-bottom:1px solid var(--bd)}
.today-row:last-child{border-bottom:0}
.today-row-icon{width:38px;height:38px;border-radius:10px;background:var(--prl);color:var(--pr);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.today-row-icon.warn{background:var(--wal);color:var(--wa)}
.today-row-icon svg{width:19px;height:19px}
.today-row-body{flex:1;min-width:0}
.today-row-title{font-size:13px;font-weight:700}
.today-row-meta{font-size:11px;color:var(--tx2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.today-row-count{font-size:14px;font-weight:700;color:var(--tx)}
.today-receipt{width:100%;border:1px solid var(--bd);border-radius:14px;background:var(--card);padding:14px;display:flex;align-items:center;gap:12px;text-align:left;color:var(--tx);cursor:pointer;transition:border-color .18s,transform .15s}
.today-receipt:hover{border-color:var(--pr);transform:translateY(-1px)}
.today-receipt .today-row-icon{background:var(--pr);color:#fff}
.today-receipt-arrow{color:var(--pr);font-size:18px;font-weight:700}
.stock-detail-modal{max-width:560px;max-height:92vh;overflow-y:auto}
.stock-detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.stock-detail-kicker{font-size:10px;color:var(--tx2);font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.stock-detail-name{font-size:24px;font-weight:700;letter-spacing:-.5px}
.stock-detail-close{width:38px;height:38px;border:0;border-radius:50%;background:var(--bg);color:var(--tx);font-size:20px;cursor:pointer;flex-shrink:0}
.stock-level-card{padding:16px;background:var(--prl);border:1px solid #CFE8DA;border-radius:15px}
.stock-level-value{font-size:32px;font-weight:700;letter-spacing:-1px;margin-top:3px}
.stock-meter{height:7px;border-radius:999px;background:var(--bd);overflow:hidden;margin:12px 0}
.stock-meter-fill{height:100%;border-radius:inherit;background:var(--pr)}
.stock-level-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stock-level-grid>div{border-right:1px solid #CFE0D5;padding-right:8px}
.stock-level-grid>div:last-child{border-right:0}
.stock-detail-label{font-size:10px;color:var(--tx2);font-weight:600}
.stock-detail-value{font-size:16px;font-weight:700;margin-top:3px}
.stock-detail-section{margin-top:18px}
.stock-detail-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.stock-detail-section-title{font-size:13px;font-weight:700}
.stock-price-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--bd)}
.stock-price-row:last-child{border-bottom:0}
.stock-price-store{font-size:13px;font-weight:700}
.stock-price-pack{font-size:11px;color:var(--tx2)}
.stock-price-main{grid-row:1/3;grid-column:2;text-align:right;font-size:13px;font-weight:700}
.stock-price-main span{display:block;font-size:10px;color:var(--tx2);font-weight:500;margin-top:3px}
.stock-legacy-note{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--wal);color:#7A4D0B;font-size:10px;line-height:1.45}
.stock-history-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.stock-history-row:last-child{border-bottom:0}
.stock-history-date{font-size:10px;color:var(--tx2);min-width:72px}
.stock-history-body{flex:1;min-width:0}
.stock-history-price{font-size:12px;font-weight:700}
.stat-card:nth-child(1){animation:statIn .3s .04s both}
.stat-card:nth-child(2){animation:statIn .3s .09s both}
.stat-card:nth-child(3){animation:statIn .3s .14s both}
.stat-card:nth-child(4){animation:statIn .3s .19s both}
.page-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:12px}
.page-title{font-size:22px;font-weight:700;line-height:1}
.page-sub{font-size:13px;color:var(--tx2);margin-top:3px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;transition:box-shadow .2s,border-color .2s,transform .2s}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat-card{padding:14px 16px;cursor:default;transition:box-shadow .22s cubic-bezier(.4,0,.2,1),transform .22s cubic-bezier(.4,0,.2,1)}
.stat-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.stat-val{font-size:26px;font-weight:700;line-height:1}
.stat-lbl{font-size:11px;color:var(--tx2);margin-top:4px;font-weight:500}
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:5px;font-size:9px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;transition:transform .15s}
.b-out{background:var(--erl);color:var(--er);animation:badgePulse 2s ease-in-out infinite}
.b-low{background:var(--wal);color:var(--wa)}
.b-ok{background:var(--okl);color:var(--ok)}
.item-row{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-bottom:5px;overflow:hidden;transition:box-shadow .2s,border-color .2s,transform .2s}
.item-row:hover{box-shadow:0 4px 16px rgba(0,0,0,.07);border-color:rgba(192,86,33,.2);transform:translateY(-1px)}
.item-main{padding:11px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .15s}
.item-main:hover{background:rgba(192,86,33,.02)}
.item-body{flex:1;min-width:0}
.item-top{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.item-name{font-size:14px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-price{font-size:11px;font-weight:600;color:var(--ok);flex-shrink:0}
.item-meta{display:flex;align-items:center;gap:5px;margin-bottom:5px;flex-wrap:wrap}
.item-qty{font-size:12px;color:var(--tx2)}
.store-tag{font-size:10px;font-weight:600;background:#F0EBE3;color:#7C6F64;padding:2px 7px;border-radius:4px}
.item-note{font-size:10px;color:var(--mu);font-style:italic}
.prog{height:3px;background:var(--bd);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.bar-fill{height:100%;border-radius:4px;transition:width .7s cubic-bezier(.4,0,.2,1);display:flex;align-items:center;padding-right:7px;justify-content:flex-end;min-width:2px}.edit-panel{padding:12px 14px 14px;border-top:1px solid var(--bd);background:#FAFAF8;animation:slideUp .22s cubic-bezier(.4,0,.2,1)}
.e-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;gap:10px}
.e-lbl{font-size:11px;font-weight:700;color:var(--tx2);min-width:44px;text-transform:uppercase;letter-spacing:.3px;flex-shrink:0}
.e-inp{flex:1;max-width:180px;padding:7px 10px;border:1px solid var(--bd);border-radius:7px;font-size:13px;background:var(--card);color:var(--tx);outline:none;transition:border-color .18s,box-shadow .18s}
.e-inp:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(192,86,33,.1)}
.qk-btns{display:flex;gap:4px}
.qk-btn{padding:6px 10px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;border:none;transition:transform .12s,box-shadow .12s}
.qk-btn:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.qk-btn:active{transform:scale(.93)}
.qk-m{background:var(--erl);color:var(--er)}
.qk-p{background:var(--okl);color:var(--ok)}
.del-btn{width:100%;padding:8px;background:none;border:1px solid #FECACA;border-radius:7px;color:var(--er);font-size:12px;font-weight:600;cursor:pointer;margin-top:6px;transition:background .15s,transform .15s}
.del-btn:hover{background:var(--erl);transform:translateY(-1px)}
.del-btn:active{transform:scale(.98)}
.grp-head{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mu);font-weight:700;margin:16px 0 6px;padding-bottom:5px;border-bottom:1px solid var(--bd);animation:fadeIn .2s ease}
.bk-check{width:18px;height:18px;border-radius:5px;border:2px solid var(--bd);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;transition:all .18s cubic-bezier(.4,0,.2,1)}
.bk-check:hover{border-color:var(--pr);transform:scale(1.12)}
.bk-check.on{background:var(--pr);border-color:var(--pr);animation:checkPop .25s cubic-bezier(.34,1.56,.64,1)}
.inp{width:100%;padding:10px 13px;border:1px solid var(--bd);border-radius:9px;font-size:14px;background:var(--card);color:var(--tx);outline:none;transition:border-color .18s,box-shadow .18s}
.inp:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(192,86,33,.12)}
.inp-big{font-size:22px;font-weight:700;padding:12px 14px}
.sel{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;font-size:13px;background:var(--card);color:var(--tx);outline:none}
.sel:focus{border-color:var(--pr)}
.f-lbl{display:block;font-size:11px;font-weight:700;color:var(--tx2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.f-grp{margin-bottom:13px}
.f-row{display:flex;gap:12px}
.f-row .f-grp{flex:1}
.btn-pr{padding:10px 18px;background:var(--pr);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s,transform .15s,box-shadow .15s}
.btn-pr:hover{opacity:.92;transform:translateY(-1px);box-shadow:0 4px 14px rgba(192,86,33,.35)}
.btn-pr:active{transform:scale(.97);box-shadow:none}
.btn-pr:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn-gh{padding:10px 18px;background:var(--bd);color:var(--tx2);border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s,transform .15s}
.btn-gh:hover{background:#DDD8D0;transform:translateY(-1px)}
.btn-gh:active{transform:scale(.97)}
.btn-er{padding:7px 14px;background:var(--er);color:#fff;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;transition:opacity .15s,transform .15s}
.btn-er:hover{opacity:.88;transform:translateY(-1px)}
.btn-er:active{transform:scale(.96)}

window.mileageStore = {
  // Save to BOTH Supabase (if session id known) and localStorage
  async save(sid, data) {
    const a = JSON.parse(localStorage.getItem('jk_miles') || '{}');
    a[sid] = { ...(a[sid] || {}), ...data };
    localStorage.setItem('jk_miles', JSON.stringify(a));
    // Map the keys we care about onto session columns
    const row = {};
    if ('start_miles' in data) row.start_miles = data.start_miles;
    if ('end_miles' in data) row.end_miles = data.end_miles;
    if ('driver' in data) row.driver_name = data.driver;
    if (Object.keys(row).length > 0) {
      try { await window.db.update_session(sid, row); } catch {}
    }
  },
  // Get prefers session columns if a session object is passed, else localStorage by id
  get(sidOrSession) {
    // If passed a session object, prefer its columns
    if (sidOrSession && typeof sidOrSession === 'object') {
      const s = sidOrSession;
      const ls = (JSON.parse(localStorage.getItem('jk_miles') || '{}'))[s.id] || {};
      return {
        start_miles: s.start_miles != null ? Number(s.start_miles) : ls.start_miles,
        end_miles: s.end_miles != null ? Number(s.end_miles) : ls.end_miles,
        driver: s.driver_name || ls.driver,
        end_time: ls.end_time, // not yet synced
      };
    }
    // Legacy path: by id from localStorage
    return (JSON.parse(localStorage.getItem('jk_miles') || '{}'))[sidOrSession] || {};
  },
};

const { useState, useEffect, useCallback, useRef, useMemo } = React;

function PrivateImage({ bucket, path, openOnClick = false, ...props }) {
  const [src, setSrc] = useState(null);
  useEffect(() => {
    let active = true;
    let objectUrl = null;
    if (!path) { setSrc(null); return () => {}; }
    db.getSignedFileUrl(bucket, path, 900).then((url) => {
      if (active) setSrc(url);
    }).catch(() => { if (active) setSrc(null); });
    return () => { active = false; if (objectUrl) URL.revokeObjectURL(objectUrl); };
  }, [bucket, path]);
  if (!src) return null;
  return <img {...props} src={src} onClick={openOnClick ? () => window.open(src, '_blank', 'noopener,noreferrer') : props.onClick} />;
}
function Badge({ status }) {
  if (status === 'out') return <span className="badge b-out">Out</span>;
  if (status === 'low') return <span className="badge b-low">Low</span>;
  return <span className="badge b-ok">OK</span>;
}
function StatCard({ val, label, color, sub }) {
  const [displayed, setDisplayed] = useState(val);
  const [pop, setPop] = useState(false);
  const prevRef = useRef(val);
  useEffect(() => {
    if (val !== prevRef.current) {setPop(true);setTimeout(() => setPop(false), 400);}
    prevRef.current = val;
    setDisplayed(val);
  }, [val]);
  return (
    <div className="card stat-card" style={{ position: 'relative', overflow: 'hidden' }}>
      <div className="stat-val" style={{ color: color || 'var(--tx)', transition: 'transform .2s', transform: pop ? 'scale(1.18)' : 'scale(1)' }}>{displayed}</div>
      <div className="stat-lbl">{label}</div>
      {sub && <div style={{ fontSize: 10, color: 'var(--mu)', marginTop: 2 }}>{sub}</div>}
    </div>);

}
function BarChartSVG({ data, color = 'var(--pr)', fmt = '' }) {
  const max = Math.max(...data.map((d) => d.value), 1);
  const [widths, setWidths] = useState(data.map(() => 0));
  useEffect(() => {
    const t = setTimeout(() => setWidths(data.map((d) => d.value / max * 100)), 60);
    return () => clearTimeout(t);
  }, []);
  return (
    <div className="chart-wrap">
      {data.map((d, i) =>
      <div key={i} className="bar-row" style={{ animation: `rowIn .3s ${i * .04}s both` }}>
          <div className="bar-lbl" title={d.label}>{d.label}</div>
          <div className="bar-track">
            <div className="bar-fill" style={{ width: `${widths[i]}%`, background: color, transition: `width .7s ${i * .05}s cubic-bezier(.4,0,.2,1)` }}>
              {d.value > 0 && <span className="bar-num">{fmt}{d.value.toFixed(0)}</span>}
            </div>
          </div>
        </div>
      )}
    </div>);

}

function StockDetailModal({ item, relatedItems, purchases, loading, onClose }) {
  const par = Number(item.par_level || 0);
  const current = Number(item.current_qty || 0);
  const need = Math.max(0, par - current);
  const pct = par > 0 ? Math.min(100, current / par * 100) : 0;
  const matchingPurchases = purchases
    .filter(p => p.item_id === item.id || String(p.item_name || '').trim().toLowerCase() === String(item.name || '').trim().toLowerCase())
    .sort((a, b) => new Date(b.purchased_at || 0) - new Date(a.purchased_at || 0));
  const latestByStore = matchingPurchases.reduce((map, purchase) => {
    const store = purchase.store || 'Unknown store';
    if (!map[store]) map[store] = purchase;
    return map;
  }, {});
  const storeListings = relatedItems.length > 0 ? relatedItems : [item];
  return <div className="overlay" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
    <section className="modal stock-detail-modal" role="dialog" aria-modal="true" aria-label={`${item.name} stock details`}>
      <div className="stock-detail-head">
        <div><div className="stock-detail-kicker">{item.category || 'Inventory item'} · {item.store || 'No preferred store'}</div><div className="stock-detail-name">{item.name}</div></div>
        <button className="stock-detail-close" aria-label="Close stock details" onClick={onClose}>×</button>
      </div>
      <div className="stock-level-card">
        <div className="stock-detail-label">Current stock</div><div className="stock-level-value">{current} {item.unit}</div>
        <div className="stock-meter" role="progressbar" aria-label="Current stock compared with par" aria-valuenow={current} aria-valuemin="0" aria-valuemax={Math.max(par, current, 1)}><div className="stock-meter-fill" style={{ width: `${pct}%` }} /></div>
        <div className="stock-level-grid">
          <div><div className="stock-detail-label">Par level</div><div className="stock-detail-value">{par} {item.unit}</div></div>
          <div><div className="stock-detail-label">Reorder at</div><div className="stock-detail-value">{par} {item.unit}</div></div>
          <div><div className="stock-detail-label">Planned need</div><div className="stock-detail-value">{need} {item.unit}</div></div>
        </div>
      </div>

      <div className="stock-detail-section">
        <div className="stock-detail-section-head"><div className="stock-detail-section-title">Store listings</div><span className="stock-detail-label">Current tracked prices</span></div>
        <div className="today-list">
          {storeListings.map(listing => {
            const packSize = Number(listing.pack_size || 1);
            const price = Number(listing.price || 0);
            const normalized = price > 0 && packSize > 1 ? price / packSize : null;
            const observed = latestByStore[listing.store || 'Unknown store'];
            return <div className="stock-price-row" key={listing.id} style={{ paddingLeft: 13, paddingRight: 13 }}>
              <div className="stock-price-store">{listing.store || 'Other'}</div>
              <div className="stock-price-pack">{packSize > 1 ? `${packSize} ${listing.unit} per package` : 'Package details not recorded'}</div>
              <div className="stock-price-main">{price > 0 ? `$${price.toFixed(2)}/package` : 'No price'}
                <span>{normalized ? `$${normalized.toFixed(2)}/${listing.unit}` : 'Normalized price unavailable'}</span>
                <span>{observed?.purchased_at ? `Observed ${new Date(observed.purchased_at).toLocaleDateString()}` : 'Observation date unavailable'}</span>
              </div>
            </div>;
          })}
        </div>
        <div className="stock-legacy-note">Normalized comparisons appear only when a package size is recorded. Historical receipt rows do not yet preserve package details, so the app does not guess conversions.</div>
      </div>

      <div className="stock-detail-section">
        <div className="stock-detail-section-head"><div className="stock-detail-section-title">Receipt price observations</div><span className="stock-detail-label">Newest first</span></div>
        <div className="today-list" style={{ padding: '0 13px' }}>
          {loading && <div className="stock-history-row"><div className="stock-history-body">Loading price history…</div></div>}
          {!loading && matchingPurchases.slice(0, 8).map(purchase => <div className="stock-history-row" key={purchase.id}>
            <div className="stock-history-date">{purchase.purchased_at ? new Date(purchase.purchased_at).toLocaleDateString() : 'No date'}</div>
            <div className="stock-history-body"><div className="today-row-title">{purchase.store || 'Unknown store'}</div><div className="today-row-meta">{purchase.qty || 1} recorded package{Number(purchase.qty || 1) === 1 ? '' : 's'} · package details unavailable</div></div>
            <div className="stock-history-price">${Number(purchase.price || 0).toFixed(2)}</div>
          </div>)}
          {!loading && matchingPurchases.length === 0 && <div className="stock-history-row"><div className="stock-history-body"><div className="today-row-title">No confirmed receipt history yet</div><div className="today-row-meta">Future confirmed receipts will appear here.</div></div></div>}
        </div>
      </div>
    </section>
  </div>;
}

function InventoryView({ items, onUpdate, onDelete, flash }) {

  const [detailItem, setDetailItem] = useState(null);
  const [purchases, setPurchases] = useState([]);
  const [pricesLoading, setPricesLoading] = useState(false);

  const openDetails = async (item) => {
    setDetailItem(item);
    if (purchases.length > 0) return;
    setPricesLoading(true);
    try { setPurchases(await db.getPurchaseLog()); } catch { flash('Could not load price history'); }
    setPricesLoading(false);
  };

  const filtered = items.filter((i) => {
    if (search && !i.name.toLowerCase().includes(search.toLowerCase())) return false;
    if (catF !== 'All' && i.category !== catF) return false;
    if (storeF !== 'All' && i.store !== storeF) return false;
    if (lowOnly && i.current_qty >= i.par_level) return false;
    return true;
  });
  const grouped = filtered.reduce((a, i) => {
    const key = groupBy === 'store' ? (i.store || 'Other') : i.category;
    (a[key] = a[key] || []).push(i);
    return a;
  }, {});
  const toggleSel = (id) => setSelected((prev) => {const n = new Set(prev);n.has(id) ? n.delete(id) : n.add(id);return n;});
  const applyBulk = async () => {
    if (!bulkQty || !selected.size) return;
    const qty = Number(bulkQty);
    for (const id of selected) await onUpdate(id, 'current_qty', qty);
    flash(`Updated ${selected.size} items → qty ${qty}`);
    setSelected(new Set());setBulkQty('');setBulkMode(false);
  };
  return (
    <div className="page">
      {detailItem && <StockDetailModal item={detailItem} relatedItems={items.filter(i => String(i.name || '').trim().toLowerCase() === String(detailItem.name || '').trim().toLowerCase())} purchases={purchases} loading={pricesLoading} onClose={() => setDetailItem(null)} />}
      <div className="page-hdr">
        <div><div className="page-title">Stock</div><div className="page-sub">Know what you have and what needs replenishing.</div></div>
        <button className={`f-tog ${bulkMode ? 'on' : ''}`} onClick={() => {setBulkMode(!bulkMode);setSelected(new Set());}}>
          {bulkMode ? 'Cancel' : 'Count stock'}

      </div>
      <div className="stock-summary-strip">
        <div><strong>{items.length}</strong><span>items</span></div>
        <div><strong>{items.filter(i => i.current_qty > 0 && i.current_qty < i.par_level).length}</strong><span>low</span></div>
        <div><strong>{items.filter(i => i.current_qty === 0).length}</strong><span>out</span></div>
      </div>
      {bulkMode &&
      <div className="bulk-bar">
          <span style={{ fontSize: 13, fontWeight: 600 }}>{selected.size} selected</span>
          <div className="bulk-acts">
            <input type="number" placeholder="Set qty" value={bulkQty} onChange={(e) => setBulkQty(e.target.value)} className="bk-inp" />
            <button className="bk-btn bk-p" onClick={applyBulk} disabled={!bulkQty || !selected.size}>Apply</button>
            <button className="bk-btn bk-g" onClick={() => setSelected(new Set(filtered.map((i) => i.id)))}>Select All</button>
          </div>
        </div>
      }
      <input className="inp" type="text" placeholder="Search items..." value={search} onChange={(e) => setSearch(e.target.value)} style={{ marginBottom: 8 }} />
      <div className="filter-row" style={{ flexWrap: 'wrap', gap: 6 }}>
        <select className="filter-sel" value={catF} onChange={(e) => setCatF(e.target.value)}>
          <option value="All">All Categories</option>
          {CATS.map((c) => <option key={c}>{c}</option>)}
        </select>
        <select className="filter-sel" value={storeF} onChange={(e) => setStoreF(e.target.value)}>
          <option value="All">All Stores</option>
          {STORES.map((s) => <option key={s}>{s}</option>)}
        </select>
        <button className={`f-tog ${lowOnly ? 'on' : ''}`} onClick={() => setLowOnly(!lowOnly)}>Low Only</button>
        <div style={{ display: 'flex', gap: 3, background: 'var(--bg)', padding: 3, borderRadius: 8, marginLeft: 'auto' }}>
          {[['category','By Category'],['store','By Store']].map(([k,l]) => (
            <button key={k} onClick={() => setGroupBy(k)} style={{
              padding: '5px 10px', borderRadius: 6, fontSize: 10, fontWeight: 700, cursor: 'pointer', border: 'none',
              background: groupBy === k ? 'var(--card)' : 'transparent',
              color: groupBy === k ? 'var(--pr)' : 'var(--tx2)',
              boxShadow: groupBy === k ? '0 1px 3px rgba(0,0,0,.1)' : 'none',
            }}>{l}</button>
          ))}
        </div>
      </div>
      <div className="stock-mobile-results">
        {Object.keys(grouped).sort().map(grpKey => <section className="stock-mobile-group" key={grpKey}>
          <div className="stock-mobile-group-head"><span>{grpKey}</span><span>{grouped[grpKey].length}</span></div>
          <div className="stock-mobile-card">
            {grouped[grpKey].map(item => {
              const qty = Number(item.current_qty || 0), par = Number(item.par_level || 0);
              const pct = par > 0 ? Math.min(100, Math.max(0, qty / par * 100)) : 100;
              const state = qty === 0 ? 'out' : qty < par ? 'low' : 'good';
              return <button className="stock-mobile-row" key={item.id} onClick={() => bulkMode ? toggleSel(item.id) : openDetails(item)} aria-label={`${item.name}, ${qty} ${item.unit || 'units'} on hand, par ${par}`}>
                {bulkMode && <span className={`stock-select ${selected.has(item.id) ? 'selected' : ''}`} aria-hidden="true" />}
                <span className={`stock-state ${state}`}><NavIcon name="stock" /></span>
                <span className="stock-mobile-body"><strong>{item.name}</strong><small>{item.store || 'No preferred store'} · {qty} {item.unit || ''} of {par} par</small><span className="stock-mobile-meter"><i style={{width:`${pct}%`}} /></span></span>
                <span className={`stock-mobile-badge ${state}`}>{state === 'good' ? 'In stock' : state}</span>
                <span className="stock-chevron">›</span>
              </button>;
            })}
          </div>
        </section>)}
      </div>
      <div className="stock-desktop-results">
      {groupBy === 'store' && (
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 8 }}>
          {Object.entries(grouped).sort().map(([store, its]) => {
            const out = its.filter(i => i.current_qty === 0).length;
            const low = its.filter(i => i.current_qty > 0 && i.current_qty < i.par_level).length;
            return (
              <div key={store} style={{ padding: '6px 12px', background: 'var(--card)', borderRadius: 10, border: '1px solid var(--bd)', fontSize: 11 }}>
                <span style={{ fontWeight: 700 }}>{store}</span>
                <span style={{ color: 'var(--mu)', marginLeft: 6 }}>{its.length} items</span>
                {out > 0 && <span style={{ color: 'var(--er)', marginLeft: 6, fontWeight: 700 }}>{out} out</span>}
                {low > 0 && <span style={{ color: 'var(--wa)', marginLeft: 4, fontWeight: 700 }}>{low} low</span>}
              </div>
            );
          })}
        </div>
      )}
      {Object.keys(grouped).sort().map((grpKey) =>
      <div key={grpKey}>
          <div className="grp-head">
            {grpKey} <span style={{ opacity: .5 }}>({grouped[grpKey].length})</span>
            {groupBy === 'store' && (() => {
              const its = grouped[grpKey];
              const est = its.reduce((s,i) => s + Number(i.price||0) * Math.max(0,i.par_level - i.current_qty), 0);
              return est > 0 ? <span style={{ fontSize: 11, color: 'var(--pr)', fontWeight: 700, marginLeft: 8 }}>~${est.toFixed(0)} to restock</span> : null;
            })()}
          </div>
          {grouped[grpKey].map((item, idx) =>
        <div key={item.id} style={{ animation: `rowIn .28s ${idx * .03}s both` }}>
              <ItemRow item={item}
          editing={!bulkMode && editingId === item.id}
          bulk={bulkMode} selected={selected.has(item.id)}
          onToggle={() => setEditingId(editingId === item.id ? null : item.id)}
          onDetails={openDetails}
          onUpdate={onUpdate} onDelete={onDelete} onBulkToggle={toggleSel} />
            </div>
        )}
        </div>
      )}
      </div>
      {filtered.length === 0 && <div className="empty"><div className="empty-icon"></div><p>No items match your filters</p></div>}
    </div>);

}

function ShoppingView({ items, session, onCheck, onStartSession, onEndSession, onShopperNote, onScanReceipt, flash }) {
  const [storeF, setStoreF] = useState('All');
  const [expandNote, setExpandNote] = useState(null);
  const [showStart, setShowStart] = useState(false);
  const [showEnd, setShowEnd] = useState(false);
  const [elapsed, setElapsed] = useState('');
  const [planTab, setPlanTab] = useState('planned');
  const timerRef = useRef(null);
  // Smart Route / Price Compare state
  const [shopQty, setShopQty] = useState({}); // { item_id: qty } overrides for current session
  const [showRouteModal, setShowRouteModal] = useState(false);
  const [routeStep, setRouteStep] = useState('location'); // location | loading | results | route
  const [startAddress, setStartAddress] = useState('');
  const [startCoords, setStartCoords] = useState(null);
  const [destAddress, setDestAddress] = useState('');
  const [destSameAsStart, setDestSameAsStart] = useState(true);
  const [sortMode, setSortMode] = useState('proximity'); // proximity | cost
  const [radiusMiles, setRadiusMiles] = useState(15);
  const [gettingLocation, setGettingLocation] = useState(false);
  const [priceResults, setPriceResults] = useState(null);
  const [selectedStores, setSelectedStores] = useState({});
  const [routeData, setRouteData] = useState(null);
  const [routeLoading, setRouteLoading] = useState(false);
  const [routeViewMode, setRouteViewMode] = useState('map'); // map | timeline
  const mapRef = useRef(null);
  const mapInstanceRef = useRef(null);

  useEffect(() => {
    if (!session) {clearInterval(timerRef.current);setElapsed('');setShopQty({});return;}
    // Load per-session shop quantities
    db.getShopQty(session.id).then(rows => {
      const m = {};
      (rows || []).forEach(r => { m[r.item_id] = Number(r.qty); });
      setShopQty(m);
    }).catch(() => {});
    const tick = () => {
      const ms = Date.now() - new Date(session.started_at).getTime();
      const h = Math.floor(ms / 3600000),m = Math.floor(ms % 3600000 / 60000),s = Math.floor(ms % 60000 / 1000);
      setElapsed(`${h > 0 ? h + 'h ' : ''}${m}m ${s}s`);
    };
    tick();timerRef.current = setInterval(tick, 1000);
    return () => clearInterval(timerRef.current);
  }, [session]);

  const needsList = items.filter((i) => i.current_qty < i.par_level || i.checked_at);
  const unchecked = needsList.filter((i) => !i.checked_at);
  const checked = needsList.filter((i) => !!i.checked_at);
  const byStore = unchecked.reduce((a, i) => {const s = i.store || 'Other';(a[s] = a[s] || []).push(i);return a;}, {});
  const allStores = [...new Set([...unchecked, ...checked].map((i) => i.store || 'Other'))].sort();
  const showStore = storeF === 'All' ? byStore : { [storeF]: byStore[storeF] || [] };
  const checkedShow = storeF === 'All' ? checked : checked.filter((i) => (i.store || 'Other') === storeF);
  const updateShopQty = async (itemId, qty) => {
    const q = Math.max(1, Number(qty) || 1);
    setShopQty(p => ({ ...p, [itemId]: q }));
    if (session) {
      try { await db.upsertShopQty({ session_id: session.id, item_id: itemId, qty: q }); } catch {}
    }
  };

  const handleStart = async () => {
    await onStartSession();
    setShowStart(false);
  };

  const handleEnd = async () => {
    await onEndSession();
    setShowEnd(false);
  };

  // ── Smart Route / Price Compare ──
  const openRouteModal = () => {
    setShowRouteModal(true);
    setRouteStep('location');
    setPriceResults(null);
    setSelectedStores({});
    setRouteData(null);
  };

  const useCurrentLocation = () => {
    if (!navigator.geolocation) { alert('Geolocation not supported by your browser.'); return; }
    setGettingLocation(true);
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const lat = pos.coords.latitude, lon = pos.coords.longitude;
        setStartCoords({ lat, lon });
        setStartAddress(`Current location (${lat.toFixed(4)}, ${lon.toFixed(4)})`);
        setGettingLocation(false);
      },
      (err) => { alert('Location error: ' + err.message); setGettingLocation(false); },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
    );
  };

  const runPriceCompare = async () => {
    if (!startAddress.trim()) return;
    setRouteStep('loading');
    const itemList = unchecked.map(i => ({ id: i.id, name: i.name, trackedStore: i.store, trackedPrice: i.price || 0, category: i.category }));
    try {
      const resp = await window.appAuth.authFetch('/api/receipt-ocr', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          mode: 'price_compare',
          context: {
            startAddress,
            startCoords,
            sortMode,
            radiusMiles,
            items: itemList.slice(0, 12),
          },
        }),
      });
      let data;
      try {
        data = await resp.json();
      } catch (parseErr) {
        const text = await resp.text().catch(() => '');
        const hint = !resp.ok ? ` (HTTP ${resp.status})` : '';
        throw new Error(`Server returned non-JSON${hint}. Check that /api/receipt-ocr is routed to the function (netlify.toml). First chars: ${text.slice(0, 80)}`);
      }
      if (!resp.ok || data.error) {
        const detail = data.detail ? ` (${data.detail})` : '';
        const sample = data.rawSample ? `\nSample: ${data.rawSample.slice(0, 150)}` : '';
        throw new Error((data.error || 'API error') + detail + sample);
      }
      const parsed = data;

      const defaults = {};
      parsed.items = (parsed.items || []).map(item => {
        // Default selection depends on sort mode
        let sorted;
        if (sortMode === 'proximity') {
          sorted = [...(item.stores||[])].sort((a,b) => (a.distanceMiles||999) - (b.distanceMiles||999));
        } else {
          sorted = [...(item.stores||[])].sort((a,b) => a.price - b.price);
        }
        const best = sorted[0];
        defaults[item.id] = best?.store || item.stores?.[0]?.store;
        // Mark cheapest and closest separately
        const cheapest = [...(item.stores||[])].sort((a,b) => a.price - b.price)[0];
        const closest = [...(item.stores||[])].sort((a,b) => (a.distanceMiles||999) - (b.distanceMiles||999))[0];
        return { ...item, stores: item.stores.map(s => ({
          ...s,
          isCheapest: s.store === cheapest?.store,
          isClosest: s.store === closest?.store,
        })) };
      });
      setSelectedStores(defaults);
      const savings = (parsed.totalCurrentCost||0) - (parsed.totalBestCost||0);
      setPriceResults({ ...parsed, totalSavings: Math.max(0, savings) });
      setRouteStep('results');
    } catch (e) {
      alert('Price compare failed: ' + e.message);
      setRouteStep('location');
    }
  };

  const buildRoute = async () => {
    setRouteLoading(true);
    // Group items by selected store, preserving real coords/address from price compare
    const storeStops = {};
    (priceResults?.items || []).forEach(item => {
      const storeBrand = selectedStores[item.id];
      if (!storeBrand) return;
      const inv = unchecked.find(i => i.id === item.id);
      const storeMatch = item.stores.find(s => s.store === storeBrand);
      if (!storeMatch) return;
      const key = storeMatch.placeId || storeBrand;
      if (!storeStops[key]) {
        storeStops[key] = {
          brand: storeBrand,
          name: storeMatch.storeName || storeBrand,
          lat: storeMatch.lat,
          lon: storeMatch.lon,
          address: storeMatch.location || '',
          items: [],
        };
      }
      storeStops[key].items.push({
        name: item.name,
        price: storeMatch.price || 0,
        unit: inv?.unit || 'ct',
        qty: inv ? Math.max(1, inv.par_level - inv.current_qty) : 1,
      });
    });
    try {
      const resp = await window.appAuth.authFetch('/api/receipt-ocr', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          mode: 'route',
          context: {
            startAddress,
            startCoords,
            destinationAddress: destAddress,
            destSameAsStart,
            storeStops: Object.values(storeStops),
          },
        }),
      });
      let data;
      try {
        data = await resp.json();
      } catch {
        const text = await resp.text().catch(() => '');
        throw new Error(`Server returned non-JSON (HTTP ${resp.status}). ${text.slice(0, 80)}`);
      }
      if (!resp.ok || data.error) throw new Error(data.error || 'API error');

      const route = (data.route || []).map(r => {
        const stopData = Object.values(storeStops).find(s => s.brand === r.store);
        return {
          ...r,
          items: r.items?.length ? r.items : (stopData?.items || []),
          subtotal: (r.items || stopData?.items || []).reduce((s, i) => s + (i.price || 0), 0),
        };
      });
      setRouteData({
        stops: route,
        origin: data.origin,
        destination: data.destination,
        totalMiles: data.totalEstimatedMiles,
        totalMinutes: data.totalEstimatedMinutes,
        summary: data.routeSummary,
      });
      setRouteStep('route');
    } catch (e) {
      alert('Route planning failed: ' + e.message);
    }
    setRouteLoading(false);
  };

  // Map effect: render route on Leaflet map using REAL origin/destination from server
  useEffect(() => {
    if (routeStep !== 'route' || routeViewMode !== 'map' || !routeData || !mapRef.current || typeof L === 'undefined') return;
    if (mapInstanceRef.current) {
      mapInstanceRef.current.remove();
      mapInstanceRef.current = null;
    }
    const points = [];
    if (routeData.origin) points.push({ lat: routeData.origin.lat, lon: routeData.origin.lon, label: 'Start: ' + (routeData.origin.address || ''), kind: 'start' });
    routeData.stops.forEach((s, i) => {
      if (s.lat && s.lon) points.push({ lat: s.lat, lon: s.lon, label: `${i+1}. ${s.store} (${s.address || ''})`, kind: 'stop', subtotal: s.subtotal, travelNote: s.travelNote });
    });
    if (routeData.destination && routeData.destination.lat) {
      const last = points[points.length - 1];
      // Only add destination if it's not the same as the last stop
      if (!last || (Math.abs(last.lat - routeData.destination.lat) > 0.0001 || Math.abs(last.lon - routeData.destination.lon) > 0.0001)) {
        points.push({ lat: routeData.destination.lat, lon: routeData.destination.lon, label: 'End: ' + (routeData.destination.address || ''), kind: 'end' });
      }
    }
    if (points.length === 0) return;

    // Center on average
    const avgLat = points.reduce((s,p) => s + p.lat, 0) / points.length;
    const avgLon = points.reduce((s,p) => s + p.lon, 0) / points.length;
    const map = L.map(mapRef.current, { zoomControl: true, attributionControl: false }).setView([avgLat, avgLon], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
    mapInstanceRef.current = map;

    // Add markers
    points.forEach((p, i) => {
      const isStart = p.kind === 'start';
      const isEnd = p.kind === 'end';
      const color = isStart ? '#15803D' : isEnd ? '#6B5E57' : '#C05621';
      const icon = L.divIcon({
        className: 'custom-map-marker',
        html: `<div style="background:${color};color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);">${isStart ? 'A' : isEnd ? 'B' : (i)}</div>`,
        iconSize: [28, 28], iconAnchor: [14, 14],
      });
      const marker = L.marker([p.lat, p.lon], { icon }).addTo(map);
      let popupContent = `<b>${p.label}</b>`;
      if (p.travelNote) popupContent += `<br/><small>${p.travelNote}</small>`;
      if (p.subtotal) popupContent += `<br/>Subtotal: $${p.subtotal.toFixed(2)}`;
      marker.bindPopup(popupContent);
    });

    // Draw animated polyline between points
    if (points.length > 1) {
      const latlngs = points.map(p => [p.lat, p.lon]);
      // Static line
      const baseLine = L.polyline(latlngs, { color: '#C05621', weight: 3, opacity: 0.4, dashArray: '6, 8' }).addTo(map);
      // Animated overlay: progressively reveal
      let progress = 0;
      const segments = [];
      for (let i = 1; i < latlngs.length; i++) segments.push([latlngs[i-1], latlngs[i]]);
      const animatedLines = segments.map(seg =>
        L.polyline([seg[0]], { color: '#C05621', weight: 4, opacity: 0.95 }).addTo(map)
      );
      let segIdx = 0, segProgress = 0;
      const step = () => {
        if (!mapInstanceRef.current || segIdx >= segments.length) return;
        const [a, b] = segments[segIdx];
        segProgress += 0.04;
        if (segProgress >= 1) {
          animatedLines[segIdx].setLatLngs([a, b]);
          segIdx++;
          segProgress = 0;
        } else {
          const lat = a[0] + (b[0] - a[0]) * segProgress;
          const lon = a[1] + (b[1] - a[1]) * segProgress;
          animatedLines[segIdx].setLatLngs([a, [lat, lon]]);
        }
        if (segIdx < segments.length) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
      // Fit bounds
      map.fitBounds(L.latLngBounds(latlngs), { padding: [40, 40] });
    }

    return () => {
      if (mapInstanceRef.current) {
        mapInstanceRef.current.remove();
        mapInstanceRef.current = null;
      }
    };
  }, [routeStep, routeViewMode, routeData]);

  return (
    <div className="page">
      {/* Start Session Modal */}
      {showStart &&
      <div className="overlay">
          <div className="modal">
            <div className="modal-title">Start shopping run</div>
            <div className="modal-sub">Items checked during the run move into your cart. Inventory changes only after you review and confirm a receipt.</div>
            <div className="trip-box">
              <div className="trip-row"><span className="trip-lbl">Planned items</span><span className="trip-val">{unchecked.length}</span></div>
              <div className="trip-row"><span className="trip-lbl">Current inventory</span><span className="trip-val">Unchanged</span></div>
            </div>
            <div className="m-acts">
              <button className="btn-gh" onClick={() => setShowStart(false)}>Cancel</button>
              <button className="btn-pr" style={{ flex: 1 }} onClick={handleStart}>Start run</button>
            </div>
          </div>
        </div>
      }
      {/* End Session Modal */}
      {showEnd && session &&
      <div className="overlay">
          <div className="modal">
            <div className="modal-title">Finish shopping run?</div>
            <div className="modal-sub">Cart checks are intent, not proof of purchase. Scan every store receipt before finishing so confirmed purchases update inventory.</div>
            <div className="trip-box">
              <div className="trip-row"><span className="trip-lbl">In cart</span><span className="trip-val">{checked.length}</span></div>
              <div className="trip-row"><span className="trip-lbl">Still planned</span><span className="trip-val">{unchecked.length}</span></div>
              <div className="trip-row"><span className="trip-lbl">Duration</span><span className="trip-val">{elapsed}</span></div>
            </div>
            <button className="btn-full" onClick={() => { setShowEnd(false); onScanReceipt(); }}>Scan another receipt</button>
            <div className="m-acts">
              <button className="btn-gh" onClick={() => setShowEnd(false)}>Keep Shopping</button>
              <button className="btn-pr" style={{ flex: 1 }} onClick={handleEnd}>Finish run</button>
            </div>
          </div>
        </div>
      }
      {/* Session banner */}
      {session &&
      <div className="sess-banner">
          <div className="sess-top">
            <span className="sess-lbl">Shopping run active</span>
            <button className="btn-er" onClick={() => setShowEnd(true)}>Finish run</button>
          </div>
          <div className="sess-meta">
            <span className="sess-timer">{elapsed}</span>
            <span>{checked.length} in cart</span>
            <span>Inventory unchanged</span>
          </div>
        </div>
      }
      <div className="page-hdr">
        <div>
          <div className="page-title">Shopping plan</div>
          <div className="page-sub">Generated from stock levels. Cart checks never change inventory.</div>
        </div>
        {!session && <button className="btn-pr" onClick={() => setShowStart(true)}>Start run</button>}
      </div>
      <div className="plan-overview">
        <div className="plan-overview-copy"><span>{session ? 'Run in progress' : 'Ready to shop'}</span><strong>{unchecked.length + checked.length} items</strong><small>{checked.length} in cart · {unchecked.length} still planned</small></div>
        <div className="plan-ring" style={{'--plan-progress': `${needsList.length ? Math.round(checked.length / needsList.length * 100) : 0}%`}}><span>{needsList.length ? Math.round(checked.length / needsList.length * 100) : 0}%</span></div>
      </div>
      <div className="plan-tabs" role="tablist" aria-label="Shopping run items">
        <button role="tab" aria-selected={planTab === 'planned'} onClick={() => setPlanTab('planned')}>Planned <span>{unchecked.length}</span></button>
        <button role="tab" aria-selected={planTab === 'cart'} onClick={() => setPlanTab('cart')}>In cart <span>{checked.length}</span></button>
      </div>
      {/* Smart Route / Price Compare */}
      {unchecked.length > 0 &&
        <button className="btn-outline" style={{ width: '100%', marginBottom: 12 }} onClick={openRouteModal}>
          Smart Route & Price Compare
        </button>
      }

      {/* Route Modal */}
      {showRouteModal && (
        <div className="overlay" onClick={e => { if (e.target === e.currentTarget) setShowRouteModal(false); }}>
          <div className="modal" style={{ maxWidth: 520, maxHeight: '92vh', overflowY: 'auto' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
              <div className="modal-title" style={{ margin: 0 }}>
                {routeStep === 'location' ? 'Smart Route & Price Compare'
                  : routeStep === 'loading' ? 'Finding best prices…'
                  : routeStep === 'results' ? 'Price Comparison'
                  : 'Your Route'}
              </div>
              <button className="panel-x" onClick={() => setShowRouteModal(false)}>×</button>
            </div>

            {/* Step 1: Location + sort mode */}
            {routeStep === 'location' && (
              <div>
                <div style={{ fontSize: 12, color: 'var(--tx2)', marginBottom: 16 }}>
                  We'll find the best stores for your {unchecked.length} item{unchecked.length !== 1 ? 's' : ''}.
                </div>

                {/* Start address */}
                <div style={{ marginBottom: 12 }}>
                  <label style={{ fontSize: 11, color: 'var(--tx2)', display: 'block', marginBottom: 4, fontWeight: 600 }}>Start address or location</label>
                  <input className="inp" value={startAddress} onChange={e => { setStartAddress(e.target.value); setStartCoords(null); }}
                    placeholder="e.g. 123 Main St, Redmond WA" autoFocus />
                  <button className="btn-outline" style={{ width: '100%', marginTop: 6, fontSize: 12 }}
                    onClick={useCurrentLocation} disabled={gettingLocation}>
                    {gettingLocation ? 'Getting location…' : 'Use my current location'}
                  </button>
                </div>

                {/* Destination toggle */}
                <div style={{ marginBottom: 12 }}>
                  <label style={{ fontSize: 11, color: 'var(--tx2)', display: 'block', marginBottom: 4, fontWeight: 600 }}>Destination after shopping</label>
                  <div style={{ display: 'flex', gap: 6, marginBottom: 6 }}>
                    <button onClick={() => setDestSameAsStart(true)} style={{
                      flex: 1, padding: '7px 10px', fontSize: 11, fontWeight: 700, borderRadius: 8, cursor: 'pointer',
                      border: '1px solid ' + (destSameAsStart ? 'var(--ok)' : 'var(--bd)'),
                      background: destSameAsStart ? 'var(--ok)' : 'var(--card)',
                      color: destSameAsStart ? '#fff' : 'var(--tx2)',
                    }}>Same as start</button>
                    <button onClick={() => setDestSameAsStart(false)} style={{
                      flex: 1, padding: '7px 10px', fontSize: 11, fontWeight: 700, borderRadius: 8, cursor: 'pointer',
                      border: '1px solid ' + (!destSameAsStart ? 'var(--pr)' : 'var(--bd)'),
                      background: !destSameAsStart ? 'var(--pr)' : 'var(--card)',
                      color: !destSameAsStart ? '#fff' : 'var(--tx2)',
                    }}>Different address</button>
                  </div>
                  {!destSameAsStart && (
                    <input className="inp" value={destAddress} onChange={e => setDestAddress(e.target.value)}
                      placeholder="e.g. Joe's Kitchen, Redmond WA" />
                  )}
                </div>

                {/* Sort mode */}
                <div style={{ marginBottom: 12 }}>
                  <label style={{ fontSize: 11, color: 'var(--tx2)', display: 'block', marginBottom: 4, fontWeight: 600 }}>Optimize for</label>
                  <div style={{ display: 'flex', gap: 6 }}>
                    <button onClick={() => setSortMode('proximity')} style={{
                      flex: 1, padding: '8px 10px', fontSize: 11, fontWeight: 700, borderRadius: 8, cursor: 'pointer',
                      border: '1px solid ' + (sortMode === 'proximity' ? 'var(--pr)' : 'var(--bd)'),
                      background: sortMode === 'proximity' ? 'var(--pr)' : 'var(--card)',
                      color: sortMode === 'proximity' ? '#fff' : 'var(--tx2)',
                    }}>Proximity (closest stores)</button>
                    <button onClick={() => setSortMode('cost')} style={{
                      flex: 1, padding: '8px 10px', fontSize: 11, fontWeight: 700, borderRadius: 8, cursor: 'pointer',
                      border: '1px solid ' + (sortMode === 'cost' ? 'var(--pr)' : 'var(--bd)'),
                      background: sortMode === 'cost' ? 'var(--pr)' : 'var(--card)',
                      color: sortMode === 'cost' ? '#fff' : 'var(--tx2)',
                    }}>Cost (lowest prices)</button>
                  </div>
                </div>

                {/* Search radius */}
                <div style={{ marginBottom: 16 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 4 }}>
                    <label style={{ fontSize: 11, color: 'var(--tx2)', fontWeight: 600 }}>Search radius</label>
                    <span style={{ fontSize: 11, color: 'var(--pr)', fontWeight: 700 }}>{radiusMiles} mi</span>
                  </div>
                  <input type="range" min="5" max="40" step="5" value={radiusMiles}
                    onChange={e => setRadiusMiles(Number(e.target.value))}
                    style={{ width: '100%', accentColor: 'var(--pr)' }} />
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 9, color: 'var(--mu)' }}>
                    <span>5 mi</span><span>40 mi</span>
                  </div>
                </div>

                <button className="btn-full" onClick={runPriceCompare}
                  disabled={!startAddress.trim() || (!destSameAsStart && !destAddress.trim())}>
                  Compare Prices
                </button>
              </div>
            )}

            {/* Step 2: Loading */}
            {routeStep === 'loading' && (
              <div style={{ padding: '40px 0', textAlign: 'center' }}>
                <div className="spinner" style={{ margin: '0 auto 16px' }} />
                <div style={{ fontSize: 13, fontWeight: 600 }}>Comparing prices across stores…</div>
                <div style={{ fontSize: 11, color: 'var(--tx2)', marginTop: 6 }}>Sorting by {sortMode === 'proximity' ? 'closest to you' : 'lowest cost'}</div>
              </div>
            )}

            {/* Step 3: Price results */}
            {routeStep === 'results' && priceResults && (
              <div>
                {priceResults.totalSavings > 0 && (
                  <div style={{ padding: 12, background: 'var(--okl)', borderRadius: 10, marginBottom: 12, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <div style={{ fontSize: 12, color: 'var(--ok)' }}>Potential savings</div>
                    <div style={{ fontSize: 18, fontWeight: 800, color: 'var(--ok)' }}>${priceResults.totalSavings.toFixed(2)}</div>
                  </div>
                )}

                {/* Stores considered — real addresses and drive times */}
                {priceResults.storesConsidered && priceResults.storesConsidered.length > 0 && (
                  <details style={{ marginBottom: 12, padding: 10, background: 'var(--bg)', borderRadius: 8 }}>
                    <summary style={{ cursor: 'pointer', fontSize: 11, color: 'var(--tx2)', fontWeight: 600 }}>
                      {priceResults.storesConsidered.length} stores within {radiusMiles} mi (Google Maps)
                    </summary>
                    <div style={{ marginTop: 8, display: 'flex', flexDirection: 'column', gap: 4 }}>
                      {[...priceResults.storesConsidered].sort((a,b) => (a.distanceMiles||999) - (b.distanceMiles||999)).map((s, i) => (
                        <div key={i} style={{ fontSize: 11, padding: '4px 6px', borderRadius: 6, display: 'flex', justifyContent: 'space-between', gap: 8 }}>
                          <div style={{ minWidth: 0, flex: 1 }}>
                            <div style={{ fontWeight: 700 }}>{s.brand}</div>
                            <div style={{ fontSize: 10, color: 'var(--mu)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{s.address}</div>
                          </div>
                          <div style={{ flexShrink: 0, textAlign: 'right' }}>
                            <div style={{ fontWeight: 700, color: 'var(--pr)' }}>{s.distanceMiles?.toFixed(1)} mi</div>
                            {s.durationMinutes && <div style={{ fontSize: 10, color: 'var(--mu)' }}>{Math.round(s.durationMinutes)} min</div>}
                          </div>
                        </div>
                      ))}
                    </div>
                  </details>
                )}
                {priceResults.warning && (
                  <div style={{ padding: 10, background: 'var(--prl)', borderRadius: 8, marginBottom: 12, fontSize: 11, color: 'var(--pr)' }}>
                    {priceResults.warning}
                  </div>
                )}

                <div style={{ fontSize: 11, color: 'var(--tx2)', marginBottom: 12 }}>
                  Sorted by <b>{sortMode === 'proximity' ? 'distance' : 'price'}</b>. Tap a store to switch.
                </div>

                <div style={{ maxHeight: '50vh', overflowY: 'auto', marginBottom: 14 }}>
                  {(priceResults.items || []).map(item => {
                    const selected = selectedStores[item.id];
                    const sortedStores = [...item.stores].sort((a, b) => sortMode === 'proximity'
                      ? (a.distanceMiles || 999) - (b.distanceMiles || 999)
                      : a.price - b.price);
                    return (
                      <div key={item.id} style={{ marginBottom: 12, padding: 12, borderRadius: 10, border: '1px solid var(--bd)', background: 'var(--card)' }}>
                        <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 8 }}>{item.name}</div>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                          {sortedStores.map(s => {
                            const isSelected = selected === s.store;
                            return (
                              <div key={s.store} onClick={() => setSelectedStores(p => ({ ...p, [item.id]: s.store }))}
                                style={{
                                  display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                                  padding: '8px 10px', borderRadius: 8, cursor: 'pointer',
                                  border: '1px solid ' + (isSelected ? 'var(--ok)' : 'var(--bd)'),
                                  background: isSelected ? 'var(--okl)' : 'var(--bg)',
                                  transition: 'all .15s',
                                }}>
                                <div style={{ display: 'flex', alignItems: 'center', gap: 8, flex: 1, minWidth: 0 }}>
                                  <div style={{
                                    width: 16, height: 16, borderRadius: '50%', flexShrink: 0,
                                    border: '2px solid ' + (isSelected ? 'var(--ok)' : 'var(--bd)'),
                                    background: isSelected ? 'var(--ok)' : 'transparent',
                                  }} />
                                  <div style={{ minWidth: 0, flex: 1 }}>
                                    <div style={{ display: 'flex', alignItems: 'center', gap: 5, flexWrap: 'wrap' }}>
                                      <span style={{ fontSize: 12, fontWeight: isSelected ? 700 : 400 }}>{s.store}</span>
                                      {s.isCheapest && <span style={{ fontSize: 9, fontWeight: 700, color: 'var(--ok)', background: 'var(--okl)', padding: '1px 5px', borderRadius: 999 }}>CHEAPEST</span>}
                                      {s.isClosest && !s.isCheapest && <span style={{ fontSize: 9, fontWeight: 700, color: 'var(--pr)', background: 'var(--prl)', padding: '1px 5px', borderRadius: 999 }}>CLOSEST</span>}
                                    </div>
                                    {(s.location || s.distanceMiles != null) && (
                                      <div style={{ fontSize: 10, color: 'var(--mu)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                                        {s.distanceMiles != null && <span style={{ fontWeight: 600 }}>{s.distanceMiles.toFixed(1)} mi</span>}
                                        {s.durationMinutes != null && <span> · {Math.round(s.durationMinutes)} min</span>}
                                        {s.storeName && s.storeName !== s.store && <span> · {s.storeName}</span>}
                                      </div>
                                    )}
                                  </div>
                                </div>
                                <div style={{ textAlign: 'right', flexShrink: 0, marginLeft: 8 }}>
                                  <div style={{ fontSize: 13, fontWeight: 700, color: s.isCheapest ? 'var(--ok)' : 'var(--tx)' }}>${Number(s.price).toFixed(2)}</div>

                      <button aria-label={`Increase ${item.name} quantity`} onClick={() => updateShopQty(item.id, (shopQty[item.id] ?? nd) + 1)}>+</button>

                  </div>

                      <label htmlFor={`reason-${item.id}`}>Why will this item not be purchased?</label>
                      <textarea id={`reason-${item.id}`} className="note-inp" rows={2} placeholder="Unavailable, too expensive, wrong size…"
                    value={item.shopper_note || ''} onChange={(e) => onShopperNote(item.id, e.target.value)} />
                      <button className="panel-close" onClick={() => setExpandNote(null)}>Done</button>
                    </div>

                </article>);

          </section>);

      })}
      </>}
      {planTab === 'cart' && <>
      {checkedShow.length > 0 &&
      <div className="plan-cart-list">
          {checkedShow.map((item) =>
        <button key={item.id} className="plan-cart-item" onClick={() => onCheck(item.id)}>
              <span className="plan-cart-mark"><NavIcon name="cart" /></span>
              <span><strong>{item.name}</strong><small>{shopQty[item.id] ?? Math.max(1,item.par_level-item.current_qty)} {item.unit} planned · inventory unchanged</small></span>
              {item.price > 0 && <strong>${Number(item.price).toFixed(2)}</strong>}

      <p style={{ textAlign: 'center', color: 'var(--mu)', fontSize: 12, marginTop: 20 }}>Start a run to move planned items into your cart</p>
      }
      {checkedShow.length === 0 && <div className="plan-empty"><span><NavIcon name="cart" /></span><strong>Your cart is empty</strong><small>Check planned items as you place them in your cart.</small><button onClick={() => setPlanTab('planned')}>View planned items</button></div>}

      {session && <div className="plan-sticky-action"><button onClick={onScanReceipt}><NavIcon name="scan" />Scan store receipt</button></div>}
